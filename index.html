<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SciGIF Studio — Scientific Schematic GIF Maker</title>
<style>
  :root{
    --bg:#f1f5f9; --panel:#ffffff; --ink:#0f172a; --muted:#64748b;
    --accent:#2563eb; --border:#e2e8f0;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
  #sidebar{width:330px;min-width:330px;background:var(--panel);border-right:1px solid var(--border);padding:16px;overflow-y:auto;height:100vh}
  h1{font-size:17px;margin:0 0 2px}
  .sub{font-size:12px;color:var(--muted);margin-bottom:14px}
  fieldset{border:1px solid var(--border);border-radius:8px;margin:0 0 12px;padding:8px 12px 10px}
  legend{font-size:11px;font-weight:600;color:var(--muted);padding:0 4px;text-transform:uppercase;letter-spacing:.05em}
  label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;margin:7px 0}
  label>span:first-child{white-space:nowrap}
  span.val{color:var(--muted);font-size:12px;min-width:34px;text-align:right}
  input[type=range]{flex:1;min-width:60px}
  input[type=text],input[type=number],select{padding:4px 6px;border:1px solid var(--border);border-radius:6px;font:inherit;font-size:13px;background:#fff}
  input[type=text]{width:160px}
  input[type=number]{width:74px}
  input[type=color]{width:38px;height:24px;border:1px solid var(--border);border-radius:4px;padding:1px;background:none;cursor:pointer}
  select{width:100%}
  .desc{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4}
  button{display:block;width:100%;padding:8px 10px;margin:6px 0;border:1px solid var(--border);border-radius:8px;background:#fff;font:inherit;font-size:13px;cursor:pointer}
  button:hover{background:#f8fafc}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.primary:hover{background:#1d4ed8}
  button:disabled{opacity:.5;cursor:default}
  progress{width:100%;height:8px;margin-top:4px}
  .foot{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5}
  #main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:10px;min-width:0}
  #canvas{border:1px solid var(--border);border-radius:8px;max-width:100%;max-height:82vh;box-shadow:0 4px 18px rgba(15,23,42,.10)}
  #hint{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div id="sidebar">
  <h1>SciGIF Studio</h1>
  <div class="sub">Animated scientific schematics &rarr; looping GIF</div>

  <fieldset>
    <legend>Template</legend>
    <select id="tplSelect"></select>
    <div class="desc" id="tplDesc"></div>
  </fieldset>

  <fieldset>
    <legend>Template options</legend>
    <div id="tplParams"></div>
  </fieldset>

  <fieldset>
    <legend>Canvas</legend>
    <label><span>Width (px)</span><input type="number" id="cw" min="200" max="1600" step="10" value="800"></label>
    <label><span>Height (px)</span><input type="number" id="ch" min="200" max="1200" step="10" value="450"></label>
    <label><span>Background</span><input type="color" id="bg" value="#ffffff"></label>
    <label><span>Title</span><input type="text" id="title" placeholder="optional"></label>
    <label><span>Title color</span><input type="color" id="titleColor" value="#0f172a"></label>
  </fieldset>

  <fieldset>
    <legend>Animation</legend>
    <label><span>Duration</span><input type="range" id="dur" min="1" max="10" step="0.5" value="3"><span class="val" id="durV">3 s</span></label>
    <label><span>Frame rate</span><input type="range" id="fps" min="8" max="30" step="1" value="20"><span class="val" id="fpsV">20</span></label>
  </fieldset>

  <fieldset>
    <legend>Export</legend>
    <button id="exportBtn" class="primary">&#11015; Export GIF</button>
    <button id="pngBtn">Save current frame as PNG</button>
    <progress id="prog" max="1" value="0" hidden></progress>
    <div class="desc" id="status"></div>
  </fieldset>

  <div class="foot">All GIFs loop seamlessly. Everything renders locally in your browser &mdash; nothing is uploaded.</div>
</div>
<div id="main">
  <canvas id="canvas" width="800" height="450"></canvas>
  <div id="hint">Live preview &mdash; the exported GIF matches exactly.</div>
</div>

<script>
"use strict";
/* ============================ utilities ============================ */
const $ = s => document.querySelector(s);
function rnd(seed){ const x = Math.sin(seed*127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function lerp(a,b,u){ return a + (b-a)*u; }
function clamp(x,a,b){ return Math.min(b, Math.max(a,x)); }
function smooth(u){ u = clamp(u,0,1); return u*u*(3-2*u); }
function hex2rgb(h){ const v = parseInt(h.slice(1),16); return [(v>>16)&255,(v>>8)&255,v&255]; }
function mixColor(h1,h2,u){
  const a = hex2rgb(h1), b = hex2rgb(h2);
  return `rgb(${Math.round(lerp(a[0],b[0],u))},${Math.round(lerp(a[1],b[1],u))},${Math.round(lerp(a[2],b[2],u))})`;
}
function shade(hex,amt){ const c = hex2rgb(hex); return `rgb(${c.map(v=>clamp(v+amt,0,255)).join(",")})`; }

function text(ctx,str,x,y,o={}){
  ctx.fillStyle = o.color || "#0f172a";
  ctx.font = `${o.bold ? "600 " : ""}${o.size||14}px "Segoe UI", Arial, sans-serif`;
  ctx.textAlign = o.align || "center";
  ctx.textBaseline = o.baseline || "middle";
  ctx.fillText(str,x,y);
}
function arrow(ctx,x1,y1,x2,y2,color,w=3,head=9){
  const a = Math.atan2(y2-y1, x2-x1);
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = w; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2,y2);
  ctx.lineTo(x2-head*Math.cos(a-0.45), y2-head*Math.sin(a-0.45));
  ctx.lineTo(x2-head*Math.cos(a+0.45), y2-head*Math.sin(a+0.45));
  ctx.closePath(); ctx.fill();
}
function vArrow2(ctx,x,ya,yb,color,s){ // vertical double-headed arrow
  if (Math.abs(ya-yb) < 14*s){ ctx.strokeStyle=color; ctx.lineWidth=2*s;
    ctx.beginPath(); ctx.moveTo(x,ya); ctx.lineTo(x,yb); ctx.stroke(); return; }
  const mid = (ya+yb)/2;
  arrow(ctx,x,mid,x,ya,color,2*s,6*s);
  arrow(ctx,x,mid,x,yb,color,2*s,6*s);
}

/* ============================ GIF encoder ============================ */
/* Minimal dependency-free GIF89a encoder: ONE global color table shared by
   every frame, LZW compression, infinite loop via NETSCAPE2.0 extension.

   The palette is global on purpose. Quantizing each frame on its own makes
   smoothly shaded templates flicker: a frame needing one colour more than fits
   drops to a coarser uniform quantization, every colour in the picture shifts
   at once, and the whole image pulses. A shaded 3D surface sits right on that
   boundary, so the depth flipped dozens of times across a single export. */

const HIST_BINS = 32768;                          // 5 bits per channel
const bin5 = (r,g,b) => ((r>>3)<<10) | ((g>>3)<<5) | (b>>3);

function newHistogram(){
  return {n: new Uint32Array(HIST_BINS), sr: new Float64Array(HIST_BINS),
          sg: new Float64Array(HIST_BINS), sb: new Float64Array(HIST_BINS)};
}
function addToHistogram(h, data){
  for (let i=0;i<data.length;i+=4){
    const r=data[i], g=data[i+1], b=data[i+2], k=bin5(r,g,b);
    h.n[k]++; h.sr[k]+=r; h.sg[k]+=g; h.sb[k]+=b;
  }
}

/* Median cut over the 5-bit histogram. Palette entries are the exact mean of
   the original pixels in each box, so a flat fill that ends up alone in a box
   comes back byte-identical rather than snapped to a bucket centre. */
function buildPalette(h, maxColors){
  const {n, sr, sg, sb} = h;
  const boxOf = list => {
    let cnt=0, R=0, G=0, B=0;
    let rmin=31,rmax=0,gmin=31,gmax=0,bmin=31,bmax=0;
    for (const k of list){
      cnt += n[k]; R += sr[k]; G += sg[k]; B += sb[k];
      const r=(k>>10)&31, g=(k>>5)&31, b=k&31;
      if(r<rmin)rmin=r; if(r>rmax)rmax=r;
      if(g<gmin)gmin=g; if(g>gmax)gmax=g;
      if(b<bmin)bmin=b; if(b>bmax)bmax=b;
    }
    return {list, cnt, R, G, B, dr:rmax-rmin, dg:gmax-gmin, db:bmax-bmin};
  };
  const occupied = [];
  for (let k=0;k<HIST_BINS;k++) if (n[k]) occupied.push(k);
  let boxes = [boxOf(occupied)];
  while (boxes.length < maxColors){
    let bi = -1, best = 0;
    for (let i=0;i<boxes.length;i++){
      const b = boxes[i];
      if (b.list.length < 2) continue;
      const score = Math.max(b.dr, b.dg, b.db) * b.cnt;
      if (score > best){ best = score; bi = i; }
    }
    if (bi < 0) break;                              // every box is a single bin
    const b = boxes[bi];
    const sh = (b.dr>=b.dg && b.dr>=b.db) ? 10 : (b.dg>=b.db ? 5 : 0);
    const sorted = b.list.slice().sort((p,q) => ((p>>sh)&31) - ((q>>sh)&31));
    let acc = 0, cut = 0;
    for (; cut<sorted.length-1; cut++){ acc += n[sorted[cut]]; if (acc*2 >= b.cnt) break; }
    if (cut >= sorted.length-1) cut = sorted.length-2;   // never split off nothing
    boxes.splice(bi, 1, boxOf(sorted.slice(0,cut+1)), boxOf(sorted.slice(cut+1)));
  }
  const palette = boxes.map(b => [Math.round(b.R/b.cnt), Math.round(b.G/b.cnt),
                                  Math.round(b.B/b.cnt)]);
  const lut = new Uint8Array(HIST_BINS);
  boxes.forEach((b,i) => { for (const k of b.list) lut[k] = i; });
  return {palette, lut};
}

class GifEncoder{
  constructor(w,h,fps,palette,transparentIndex){
    this.w=w; this.h=h;
    this.delay = Math.max(2, Math.round(100/fps));
    this.tIdx = transparentIndex;
    let bits = 2;
    while ((1<<bits) < palette.length) bits++;
    this.bits = bits;
    const entries = 1<<bits;
    this.bytes=[];
    this._str("GIF89a");
    this._u16(w); this._u16(h);
    this._b(0x80 | 0x70 | (bits-1), 0, 0);        // global color table, 2^bits entries
    for (let i=0;i<entries;i++){ const c = palette[i] || [0,0,0]; this._b(c[0],c[1],c[2]); }
    this._b(0x21,0xFF,0x0B); this._str("NETSCAPE2.0"); this._b(3,1,0,0,0); // loop forever
  }
  _b(...v){ for (const x of v) this.bytes.push(x & 255); }
  _u16(v){ this._b(v & 255, (v>>8) & 255); }
  _str(s){ for (let i=0;i<s.length;i++) this.bytes.push(s.charCodeAt(i)); }
  addFrame(indices){
    // disposal=1 (leave the frame in place) + a transparent index, so a frame
    // only has to carry the pixels that actually changed
    this._b(0x21,0xF9,4,0x05, this.delay&255, (this.delay>>8)&255, this.tIdx, 0);
    this._b(0x2C); this._u16(0); this._u16(0); this._u16(this.w); this._u16(this.h);
    this._b(0);                        // no local table: every frame shares the global one
    this._b(this.bits);                // LZW min code size
    this._lzw(indices, this.bits);
  }
  _lzw(indices, minCodeSize){
    const out=[];
    const clear = 1<<minCodeSize, eoi = clear+1;
    let next = eoi+1, codeSize = minCodeSize+1;
    let cur=0, shift=0;
    const emit = c => {
      cur |= c << shift; shift += codeSize;
      while (shift >= 8){ out.push(cur & 255); cur >>>= 8; shift -= 8; }
    };
    let table = new Map();
    emit(clear);
    let prev = indices[0];
    for (let i=1;i<indices.length;i++){
      const k = indices[i];
      const key = (prev<<8) | k;
      const code = table.get(key);
      if (code !== undefined){ prev = code; continue; }
      emit(prev);
      if (next === 4096){
        emit(clear); table = new Map(); next = eoi+1; codeSize = minCodeSize+1;
      } else {
        if (next >= (1<<codeSize)) codeSize++;
        table.set(key, next++);
      }
      prev = k;
    }
    emit(prev); emit(eoi);
    if (shift > 0) out.push(cur & 255);
    for (let i=0;i<out.length;i+=255){
      const n = Math.min(255, out.length-i);
      this._b(n);
      for (let j=0;j<n;j++) this.bytes.push(out[i+j]);
    }
    this._b(0);
  }
  finish(){ this._b(0x3B); return Uint8Array.from(this.bytes); }
}

/* ============================ templates ============================ */
/* Every draw(ctx,t,P,W,H) receives t in [0,1). All motion uses integer
   frequencies of t, so the animation tiles perfectly when the GIF loops. */

function drawFlow(ctx,t,P,W,H){
  const s = W/800;
  const cy = H*0.56, th = Math.min(H*0.34, 160*s);
  const x0 = W*0.07, x1 = W*0.93, bedA = W*0.40, bedB = W*0.60;
  // reactor walls
  ctx.strokeStyle = P.tubeColor; ctx.lineWidth = 3*s; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(x0, cy-th/2); ctx.lineTo(x1, cy-th/2);
  ctx.moveTo(x0, cy+th/2); ctx.lineTo(x1, cy+th/2);
  ctx.stroke();
  // packed catalyst bed
  const br = 7*s;
  ctx.fillStyle = P.bedColor;
  let row = 0;
  for (let y = cy-th/2+br*1.4; y < cy+th/2-br*0.9; y += br*1.75, row++){
    const off = (row%2)*br*0.95;
    for (let x = bedA+br+off; x < bedB-br*0.5; x += br*1.9){
      ctx.beginPath(); ctx.arc(x,y,br,0,7); ctx.fill();
    }
  }
  ctx.save();
  ctx.setLineDash([5*s,4*s]); ctx.strokeStyle = P.tubeColor; ctx.lineWidth = 1.5*s;
  ctx.beginPath();
  ctx.moveTo(bedA, cy-th/2); ctx.lineTo(bedA, cy+th/2);
  ctx.moveTo(bedB, cy-th/2); ctx.lineTo(bedB, cy+th/2);
  ctx.stroke();
  ctx.restore();
  // gas molecules: reactant color before the bed, product color after
  const pr = 5.5*s;
  for (let i=0;i<P.particles;i++){
    const u = (rnd(i*3+1) + t*P.speed) % 1;
    const x = x0 + u*(x1-x0);
    const fq = 1 + Math.floor(rnd(i*7+2)*3);
    const y = cy + (rnd(i*3+2)-0.5)*(th-6*pr) + Math.sin(2*Math.PI*(fq*t + rnd(i*3+3)))*2.5*s;
    const conv = smooth((x-bedA)/(bedB-bedA));
    ctx.fillStyle = mixColor(P.reactantColor, P.productColor, conv);
    ctx.beginPath(); ctx.arc(x,y,pr,0,7); ctx.fill();
  }
  // labels
  const ly = cy - th/2 - 22*s;
  const lxi = (x0+bedA)/2, lxo = (bedB+x1)/2;
  text(ctx, P.inLabel,  lxi, ly-14*s, {size:15*s, bold:true, color:P.reactantColor});
  arrow(ctx, lxi-22*s, ly, lxi+22*s, ly, P.reactantColor, 3*s, 8*s);
  text(ctx, P.outLabel, lxo, ly-14*s, {size:15*s, bold:true, color:P.productColor});
  arrow(ctx, lxo-22*s, ly, lxo+22*s, ly, P.productColor, 3*s, 8*s);
  text(ctx, P.bedLabel, W/2, cy+th/2+22*s, {size:14*s, color:"#334155"});
}

/* gas library for the membrane template: atom offsets/radii in units of s,
   w = visual width (for sizing the pore gap), tint = label/arrow color */
const GASES = {
  H2:  {label:"H₂",  tint:"#2563eb", w:13, atoms:[
         {dx:-3,dy:0,r:3.5,c:"#93c5fd"},{dx:3,dy:0,r:3.5,c:"#93c5fd"}]},
  He:  {label:"He",  tint:"#7c3aed", w:8,  atoms:[{dx:0,dy:0,r:4,c:"#c4b5fd"}]},
  H2O: {label:"H₂O", tint:"#0284c7", w:15, atoms:[
         {dx:0,dy:1,r:4.5,c:"#ef4444"},
         {dx:-4.5,dy:-2.5,r:2.8,c:"#e2e8f0"},{dx:4.5,dy:-2.5,r:2.8,c:"#e2e8f0"}]},
  N2:  {label:"N₂",  tint:"#1d4ed8", w:18, atoms:[
         {dx:-4.5,dy:0,r:4.5,c:"#3b82f6"},{dx:4.5,dy:0,r:4.5,c:"#3b82f6"}]},
  O2:  {label:"O₂",  tint:"#b91c1c", w:18, atoms:[
         {dx:-4.5,dy:0,r:4.5,c:"#ef4444"},{dx:4.5,dy:0,r:4.5,c:"#ef4444"}]},
  CO:  {label:"CO",  tint:"#9a3412", w:19, atoms:[
         {dx:-4.5,dy:0,r:5,c:"#334155"},{dx:4.5,dy:0,r:4.5,c:"#ef4444"}]},
  CH4: {label:"CH₄", tint:"#475569", w:16, atoms:[
         {dx:0,dy:0,r:5,c:"#334155"},
         {dx:-4.8,dy:-4.8,r:2.6,c:"#e2e8f0"},{dx:4.8,dy:-4.8,r:2.6,c:"#e2e8f0"},
         {dx:-4.8,dy:4.8,r:2.6,c:"#e2e8f0"},{dx:4.8,dy:4.8,r:2.6,c:"#e2e8f0"}]},
  CO2: {label:"CO₂", tint:"#dc2626", w:26, atoms:[
         {dx:0,dy:0,r:5.5,c:"#334155"},
         {dx:-8.5,dy:0,r:4.5,c:"#ef4444"},{dx:8.5,dy:0,r:4.5,c:"#ef4444"}]},
};
const GAS_OPTIONS = Object.keys(GASES).map(k => [k, GASES[k].label]);

function drawGasMol(ctx,g,x,y,s,ang){
  const ca = Math.cos(ang), sa = Math.sin(ang);
  ctx.lineWidth = 1*s; ctx.strokeStyle = "#64748b";
  for (const a of g.atoms){
    ctx.fillStyle = a.c;
    ctx.beginPath();
    ctx.arc(x+(a.dx*ca-a.dy*sa)*s, y+(a.dx*sa+a.dy*ca)*s, a.r*s, 0, 7);
    ctx.fill(); ctx.stroke();
  }
}

function drawMembrane(ctx,t,P,W,H){
  const s = W/800;
  const gA = GASES[P.gasA], gB = GASES[P.gasB];
  // horizontal membrane slab; feed flows above it, permeate drops below
  const mx0 = W*0.14, mx1 = W*0.86;
  const myT = H*0.54, mt = 26*s, myB = myT + mt;
  const feedY0 = H*0.20, feedY1 = myT - 16*s;
  const permY1 = H*0.86;
  const xIn = W*0.02, xOut = W*0.98;
  // pore gap sized between the two molecules (always wide enough for gas A)
  const pw = Math.max(((gA.w+gB.w)/2)*s, (gA.w+5)*s);
  const nP = P.pores;
  const poreXs = [];
  for (let i=0;i<nP;i++) poreXs.push(mx0 + (mx1-mx0)*(i+1)/(nP+1));
  // membrane slab segments between pores, with stacked GO-sheet texture
  const edges = [mx0, ...poreXs.flatMap(x=>[x-pw/2, x+pw/2]), mx1];
  for (let k=0;k<edges.length;k+=2){
    const a = edges[k], b = edges[k+1];
    ctx.fillStyle = P.membraneColor;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(a, myT, b-a, mt, 3*s);
    else ctx.rect(a, myT, b-a, mt);
    ctx.fill();
    ctx.strokeStyle = shade(P.membraneColor, 60); ctx.lineWidth = 1.5*s;
    for (let r=1;r<=3;r++){
      const ly = myT + mt*r/4;
      const stag = (r%2)*8*s;
      ctx.beginPath();
      for (let x = a+3*s+stag; x < b-3*s; x += 16*s){
        ctx.moveTo(x, ly); ctx.lineTo(Math.min(x+10*s, b-3*s), ly);
      }
      ctx.stroke();
    }
  }
  // path helpers — both loop seamlessly via u = (rnd + t*speed) % 1
  // permeate: flow right along the feed, turn down through a pore (rotating end-on), exit below
  const permeatePath = (q,u) => {
    const pore = poreXs[Math.floor(rnd(q+1)*nP)];
    const yF = feedY0 + 8*s + rnd(q+2)*(feedY1-feedY0-16*s);
    const L1 = pore - xIn;
    const d = u*(L1 + (permY1-yF));
    const jig = Math.sin(2*Math.PI*((2+Math.floor(rnd(q+3)*3))*t + rnd(q+4)));
    if (d < L1) return [xIn+d, yF + clamp((L1-d)/(80*s),0,1)*jig*4*s, 0];
    const y = yF + (d - L1);
    const x = pore + clamp((y-myB)/(60*s),0,1)*jig*3*s;
    return [x, y, (Math.PI/2)*smooth((y-yF)/Math.max(myT-yF,1))];
  };
  // retentate: straight across the feed to the right; clear>0 adds a blocked dip at the membrane
  const acrossPath = (q,u,clear) => {
    const x = xIn + u*(xOut-xIn);
    const yBase = feedY0 + 12*s + rnd(q+1)*(feedY1-feedY0-24*s);
    let y = yBase, bump = 0;
    if (clear > 0){
      const tryX = mx0 + (0.15 + 0.7*rnd(q+2))*(mx1-mx0);
      const sig = W*0.045;
      bump = Math.exp(-((x-tryX)**2)/(2*sig*sig));
      y = yBase + (myT - clear - yBase)*bump;
    }
    y += (1-bump)*Math.sin(2*Math.PI*((1+Math.floor(rnd(q+3)*2))*t + rnd(q+4)))*5*s;
    return [x, y, 0];
  };
  // gas A (small): most permeate, the rest are carried to the retentate
  for (let i=0;i<P.nA;i++){
    const q = i*5+11;
    const u = (rnd(q) + t*P.speed) % 1;
    const p = rnd(q+6)*100 < P.permA ? permeatePath(q,u) : acrossPath(q,u,0);
    drawGasMol(ctx, gA, p[0], p[1], s, p[2]);
  }
  // gas B (large): most are blocked (dip at the membrane, sweep to retentate), a few permeate
  const hB = Math.max(...gB.atoms.map(a => Math.abs(a.dy)+a.r));
  for (let i=0;i<P.nB;i++){
    const q = i*9+51;
    const u = (rnd(q) + t*P.speed) % 1;
    const p = rnd(q+6)*100 < P.permB ? permeatePath(q,u) : acrossPath(q,u,(hB+3)*s);
    drawGasMol(ctx, gB, p[0], p[1], s, p[2]);
  }
  // labels + flow arrows ("auto" composes from the selected gases)
  const feedLabel = P.feedLabel === "auto" ? gA.label+" + "+gB.label+" feed" : P.feedLabel;
  const retLabel  = P.retLabel  === "auto" ? gB.label+"-rich retentate"     : P.retLabel;
  const permLabel = P.permLabel === "auto" ? gA.label+"-rich permeate"      : P.permLabel;
  const ay = H*0.135;
  text(ctx, feedLabel, W*0.11, ay-16*s, {size:15*s, bold:true, color:"#334155"});
  arrow(ctx, W*0.045, ay, W*0.165, ay, "#334155", 3*s, 8*s);
  text(ctx, retLabel, W*0.885, ay-16*s, {size:15*s, bold:true, color:gB.tint});
  arrow(ctx, W*0.83, ay, W*0.95, ay, gB.tint, 3*s, 8*s);
  arrow(ctx, W*0.5, H*0.885, W*0.5, H*0.945, gA.tint, 3*s, 8*s);
  text(ctx, permLabel, W*0.5+16*s, H*0.915, {size:15*s, bold:true, color:gA.tint, align:"left"});
  // membrane callout
  ctx.strokeStyle = "#64748b"; ctx.lineWidth = 1.5*s;
  ctx.beginPath(); ctx.moveTo(mx1-6*s, myB+2*s); ctx.lineTo(W*0.905, myB+22*s); ctx.stroke();
  text(ctx, P.membLabel, W*0.915, myB+32*s, {size:13*s, color:"#334155"});
}

function drawCrumpled(ctx,t,P,W,H){
  const s = W/800;
  const gA = GASES[P.gasA], gB = GASES[P.gasB];
  const hA = Math.max(...gA.atoms.map(a => Math.abs(a.dy)+a.r));
  const hB = Math.max(...gB.atoms.map(a => Math.abs(a.dy)+a.r));
  // crumpled laminate: the interlayer gap breathes between compact (sieving)
  // domains at the troughs and expanded (fast-uptake) pockets at the crests
  const mx0 = W*0.12, mx1 = W*0.88, L = mx1-mx0;
  const nCr = P.crumples, nL = 4;
  const myC = H*0.58, Aw = 9*s;
  const gapX = (2*hB+9)*s;
  const gapC = Math.max(2*hA+1, Math.min(2*hA+2.5, 2*hB-1.5))*s;
  const phase = x => 2*Math.PI*nCr*(x-mx0)/L - Math.PI;
  const gap = x => gapC + (gapX-gapC)*(0.5+0.5*Math.cos(phase(x)));
  const yMid = x => myC - Aw*Math.cos(phase(x));
  const sheetY = (k,x) => yMid(x) + (k-(nL-1)/2)*gap(x);
  const crest = j => mx0 + L*(j+0.5)/nCr;
  const troughs = []; for (let j=1;j<nCr;j++) troughs.push(mx0 + L*j/nCr);
  const feedY0 = H*0.17, feedY1 = myC - Aw - (nL-1)/2*gapX - 14*s;
  const permY1 = H*0.86, xIn = W*0.02, xOut = W*0.98;
  // wide uptake holes into the pockets (top two sheets), narrow sieve holes at the troughs
  const we = (gB.w+8)*s, ws = (gA.w+4)*s;
  const inHole = (k,x) => {
    if (k < 2){ for (let j=0;j<nCr;j++) if (Math.abs(x-crest(j)) < we/2) return true; }
    else { for (const tx of troughs) if (Math.abs(x-tx) < ws/2) return true; }
    return false;
  };
  ctx.globalAlpha = 0.13; ctx.fillStyle = P.membraneColor;
  ctx.beginPath();
  for (let x=mx0; x<=mx1; x+=4*s) ctx.lineTo(x, sheetY(0,x));
  for (let x=mx1; x>=mx0; x-=4*s) ctx.lineTo(x, sheetY(nL-1,x));
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1; ctx.lineCap = "round"; ctx.lineWidth = 3.2*s;
  for (let k=0;k<nL;k++){
    ctx.strokeStyle = shade(P.membraneColor, (k%2)*24);
    ctx.beginPath();
    let pen = false;
    for (let x=mx0; x<=mx1; x+=3*s){
      if (inHole(k,x)){ pen = false; continue; }
      if (pen) ctx.lineTo(x, sheetY(k,x));
      else { ctx.moveTo(x, sheetY(k,x)); pen = true; }
    }
    ctx.stroke();
  }
  // permeate: along the feed, drop into an expanded pocket, ride the interlayer
  // channel to a compact trough, then thread the sieve holes end-on
  const permeatePath = (q,u) => {
    const j = Math.floor(rnd(q+1)*nCr);
    const ex = crest(j);
    const xx = mx0 + L*(j < nCr-1 ? j+1 : j)/nCr;
    const yF = feedY0 + 8*s + rnd(q+2)*(feedY1-feedY0-16*s);
    const L1 = ex - xIn, L2 = yMid(ex) - yF, L3 = Math.abs(xx-ex);
    const yBot = sheetY(nL-1, xx);
    const d = u*(L1+L2+L3+(permY1-yMid(xx)));
    const jig = Math.sin(2*Math.PI*((2+Math.floor(rnd(q+3)*3))*t + rnd(q+4)));
    if (d < L1) return [xIn+d, yF + clamp((L1-d)/(80*s),0,1)*jig*4*s, 0];
    if (d < L1+L2) return [ex, yF + (d-L1), 0];
    if (d < L1+L2+L3){
      const x = ex + Math.sign(xx-ex)*(d-L1-L2);
      return [x, yMid(x), 0];
    }
    const d4 = d-L1-L2-L3, y = yMid(xx) + d4;
    const ang = (Math.PI/2)*smooth(d4/Math.max(yBot-yMid(xx),1));
    return [xx + clamp((y-yBot)/(60*s),0,1)*jig*3*s, y, ang];
  };
  // retentate: straight across the feed; clear>0 adds a blocked dip at the wavy top sheet
  const acrossPath = (q,u,clear) => {
    const x = xIn + u*(xOut-xIn);
    const yBase = feedY0 + 12*s + rnd(q+1)*(feedY1-feedY0-24*s);
    let y = yBase, bump = 0;
    if (clear > 0){
      const tryX = mx0 + (0.15 + 0.7*rnd(q+2))*L;
      const sig = W*0.045;
      bump = Math.exp(-((x-tryX)**2)/(2*sig*sig));
      y = yBase + (sheetY(0,tryX) - clear - yBase)*bump;
    }
    y += (1-bump)*Math.sin(2*Math.PI*((1+Math.floor(rnd(q+3)*2))*t + rnd(q+4)))*5*s;
    return [x, y, 0];
  };
  for (let i=0;i<P.nA;i++){
    const q = i*5+11;
    const u = (rnd(q) + t*P.speed) % 1;
    const p = rnd(q+6)*100 < P.permA ? permeatePath(q,u) : acrossPath(q,u,0);
    drawGasMol(ctx, gA, p[0], p[1], s, p[2]);
  }
  for (let i=0;i<P.nB;i++){
    const q = i*9+51;
    const u = (rnd(q) + t*P.speed) % 1;
    const p = rnd(q+6)*100 < P.permB ? permeatePath(q,u) : acrossPath(q,u,(hB+3)*s);
    drawGasMol(ctx, gB, p[0], p[1], s, p[2]);
  }
  // labels + flow arrows ("auto" composes from the selected gases)
  const feedLabel = P.feedLabel === "auto" ? gA.label+" + "+gB.label+" feed" : P.feedLabel;
  const retLabel  = P.retLabel  === "auto" ? gB.label+"-rich retentate"     : P.retLabel;
  const permLabel = P.permLabel === "auto" ? gA.label+"-rich permeate"      : P.permLabel;
  const ay = H*0.115;
  text(ctx, feedLabel, W*0.11, ay-16*s, {size:15*s, bold:true, color:"#334155"});
  arrow(ctx, W*0.045, ay, W*0.165, ay, "#334155", 3*s, 8*s);
  text(ctx, retLabel, W*0.885, ay-16*s, {size:15*s, bold:true, color:gB.tint});
  arrow(ctx, W*0.83, ay, W*0.95, ay, gB.tint, 3*s, 8*s);
  arrow(ctx, W*0.5, H*0.885, W*0.5, H*0.945, gA.tint, 3*s, 8*s);
  text(ctx, permLabel, W*0.5+16*s, H*0.915, {size:15*s, bold:true, color:gA.tint, align:"left"});
  // domain + membrane callouts
  ctx.strokeStyle = "#64748b"; ctx.lineWidth = 1.5*s;
  ctx.beginPath(); ctx.moveTo(crest(0), sheetY(nL-1,crest(0))+4*s); ctx.lineTo(W*0.145, H*0.755); ctx.stroke();
  text(ctx, P.expLabel, W*0.03, H*0.79, {size:12.5*s, color:"#334155", align:"left"});
  const lastTr = troughs[troughs.length-1];
  ctx.beginPath(); ctx.moveTo(lastTr+ws/2+4*s, sheetY(nL-1,lastTr)+4*s); ctx.lineTo(W*0.80, H*0.755); ctx.stroke();
  text(ctx, P.selLabel, W*0.975, H*0.79, {size:12.5*s, color:"#334155", align:"right"});
  ctx.beginPath(); ctx.moveTo(mx1-2*s, yMid(mx1)); ctx.lineTo(W*0.93, H*0.62); ctx.stroke();
  text(ctx, P.membLabel, W*0.975, H*0.65, {size:13*s, color:"#334155", align:"right"});
}

function drawPolymer(ctx,t,P,W,H){
  const s = W/800;
  const gA = GASES[P.gasA], gB = GASES[P.gasB];
  // dense polymer film: gas dissolves at the feed face, hops between free-volume
  // elements in the chain tangle, desorbs at the permeate face. No size-sieving
  // pores, so both gases get through (fast, weakly selective).
  const mx0 = W*0.12, mx1 = W*0.88;
  const myT = H*0.42, myB = H*0.64, mt = myB-myT;
  const feedY0 = H*0.17, feedY1 = myT - 14*s;
  const permY1 = H*0.93, xIn = W*0.02, xOut = W*0.98;
  const slab = () => { ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(mx0, myT, mx1-mx0, mt, 6*s); else ctx.rect(mx0, myT, mx1-mx0, mt); };
  ctx.fillStyle = mixColor(P.membraneColor, "#ffffff", 0.82);
  slab(); ctx.fill();
  // entangled chains (static): seeded sums of sines, clipped to the slab
  ctx.save();
  slab(); ctx.clip();
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (let c=0;c<P.chains;c++){
    const q = c*13+7;
    const y0 = myT + (0.08 + 0.84*rnd(q))*mt;
    const a1 = (0.10+0.12*rnd(q+1))*mt, a2 = (0.05+0.08*rnd(q+2))*mt;
    const k1 = (2+4*rnd(q+3))/(mx1-mx0)*2*Math.PI, k2 = (7+8*rnd(q+4))/(mx1-mx0)*2*Math.PI;
    const p1 = rnd(q+5)*7, p2 = rnd(q+6)*7;
    ctx.strokeStyle = mixColor(P.membraneColor, "#ffffff", 0.25 + 0.3*rnd(q+8));
    ctx.lineWidth = 1.8*s;
    ctx.beginPath();
    for (let x=mx0-10*s; x<=mx1+10*s; x+=3*s){
      const y = y0 + a1*Math.sin(k1*x+p1) + a2*Math.sin(k2*x+p2);
      if (x === mx0-10*s) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  ctx.restore();
  ctx.strokeStyle = P.membraneColor; ctx.lineWidth = 2*s;
  slab(); ctx.stroke();

  // permeate: along the feed, dissolve at the surface, hop through the film, desorb.
  // dwell stretches the in-film leg (a more soluble gas lingers longer).
  const nHop = 5;
  const permeatePath = (q,u,dwell) => {
    const xe = mx0 + (0.06 + 0.88*rnd(q+1))*(mx1-mx0);
    const yF = feedY0 + 8*s + rnd(q+2)*(feedY1-feedY0-16*s);
    const L1 = xe - xIn, L2 = myT - yF, L3 = mt*dwell, L4 = permY1 - myB;
    const sites = [[xe, myT]];
    for (let k=1;k<nHop;k++){
      const xs = clamp(sites[k-1][0] + (rnd(q+10+k)-0.5)*44*s, mx0+8*s, mx1-8*s);
      sites.push([xs, myT + mt*k/nHop + (rnd(q+20+k)-0.5)*mt*0.08]);
    }
    const xo = clamp(sites[nHop-1][0] + (rnd(q+30)-0.5)*30*s, mx0+8*s, mx1-8*s);
    sites.push([xo, myB]);
    const d = u*(L1+L2+L3+L4);
    const jig = Math.sin(2*Math.PI*((2+Math.floor(rnd(q+3)*3))*t + rnd(q+4)));
    if (d < L1) return [xIn+d, yF + clamp((L1-d)/(80*s),0,1)*jig*4*s, 0];
    if (d < L1+L2) return [xe, yF + (d-L1), (Math.PI/2)*smooth((d-L1)/L2)];
    if (d < L1+L2+L3){
      const f = (d-L1-L2)/L3*nHop, k = Math.min(Math.floor(f), nHop-1), fr = f-k;
      const e = smooth(clamp((fr-0.35)/0.65,0,1));   // rattle in a cavity, then jump
      const rat = (1-e)*Math.sin(2*Math.PI*(3*fr + rnd(q+40+k)))*2.2*s;
      return [lerp(sites[k][0],sites[k+1][0],e)+rat, lerp(sites[k][1],sites[k+1][1],e),
              Math.PI/2 + 0.5*Math.sin(2*Math.PI*fr)];
    }
    const y = myB + (d-L1-L2-L3);
    return [xo + clamp((y-myB)/(50*s),0,1)*jig*3*s, y, (Math.PI/2)*(1-smooth((y-myB)/(40*s)))];
  };
  const acrossPath = (q,u) => {
    const x = xIn + u*(xOut-xIn);
    const yBase = feedY0 + 12*s + rnd(q+1)*(feedY1-feedY0-24*s);
    return [x, yBase + Math.sin(2*Math.PI*((1+Math.floor(rnd(q+3)*2))*t + rnd(q+4)))*5*s, 0];
  };
  // gas A diffuses faster (twice the loop speed); gas B is more soluble and lingers, but still permeates
  for (let i=0;i<P.nA;i++){
    const q = i*5+11;
    const u = (rnd(q) + t*P.speed*2) % 1;
    const p = rnd(q+6)*100 < P.permA ? permeatePath(q,u,2.2) : acrossPath(q,u);
    drawGasMol(ctx, gA, p[0], p[1], s, p[2]);
  }
  for (let i=0;i<P.nB;i++){
    const q = i*9+51;
    const u = (rnd(q) + t*P.speed) % 1;
    const p = rnd(q+6)*100 < P.permB ? permeatePath(q,u,3.2) : acrossPath(q,u);
    drawGasMol(ctx, gB, p[0], p[1], s, p[2]);
  }
  // labels + flow arrows ("auto" composes from the selected gases)
  const feedLabel = P.feedLabel === "auto" ? gA.label+" + "+gB.label+" feed" : P.feedLabel;
  const retLabel  = P.retLabel  === "auto" ? "retentate" : P.retLabel;
  const permLabel = P.permLabel === "auto" ? gA.label+" + "+gB.label+" permeate" : P.permLabel;
  const ay = H*0.105;
  text(ctx, feedLabel, W*0.11, ay-16*s, {size:15*s, bold:true, color:"#334155"});
  arrow(ctx, W*0.045, ay, W*0.165, ay, "#334155", 3*s, 8*s);
  text(ctx, retLabel, W*0.89, ay-16*s, {size:15*s, bold:true, color:"#334155"});
  arrow(ctx, W*0.83, ay, W*0.95, ay, "#334155", 3*s, 8*s);
  if (P.title) text(ctx, P.title, W*0.5, ay-8*s, {size:16*s, bold:true, color:"#0f172a"});
  text(ctx, P.membLabel, mx0, myB+18*s, {size:13*s, color:"#334155", align:"left"});
  text(ctx, P.mechLabel, mx1, myB+18*s, {size:13*s, color:"#334155", align:"right"});
  const by = H*0.955;
  text(ctx, permLabel, W*0.5, by, {size:15*s, bold:true, color:"#334155"});
  if (P.showVerdict){
    text(ctx, P.fluxLabel, W*0.03, by, {size:14*s, bold:true, color:"#15803d", align:"left"});
    text(ctx, P.selLabel,  W*0.97, by, {size:14*s, bold:true, color:"#b91c1c", align:"right"});
  }
}

function drawPSA(ctx,t,P,W,H){
  const s = W/800;
  const gA = GASES[P.gasA], gB = GASES[P.gasB];
  // twin-bed PSA: each half of the loop one column adsorbs gas B at high
  // pressure while the other is blown down at low pressure, then they swap
  const cw = W*0.13, yT = H*0.25, yB = H*0.73;
  const cx = [W*0.33, W*0.67];
  const prodY = H*0.115, feedY = H*0.845, offY = H*0.945;
  const xIn = -30*s, xL = W*0.03, xR = W*0.955, xOut = W + 30*s;
  const pr0 = smooth(t/0.07) - smooth((t-0.5)/0.07);
  const press = c => c === 0 ? pr0 : 1 - pr0;
  const uh = (2*t) % 1, adsCol = t < 0.5 ? 0 : 1;
  const bRows = 7, bCols = 3, nBeads = bRows*bCols, bR = 8.5*s;
  const beadPos = (c,bi) => {
    const r = Math.floor(bi/bCols), k = bi%bCols;
    return [cx[c] + (k-1)*30*s + (rnd(c*97+bi*3)*2-1)*4*s,
            yT + 20*s + r*(yB-yT-40*s)/(bRows-1) + (rnd(c*97+bi*3+1)*2-1)*3*s];
  };
  // piping: gray base, dark overlay on the segments whose valves are open
  const pipe = (x1,y1,x2,y2) => { ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); };
  ctx.lineCap = "round"; ctx.lineWidth = 5*s; ctx.strokeStyle = "#cbd5e1";
  pipe(xL, feedY, cx[1], feedY);
  pipe(cx[0], offY, xR, offY);
  pipe(cx[0], prodY, xR, prodY);
  for (const c of [0,1]){ pipe(cx[c], yB+8*s, cx[c], offY); pipe(cx[c], prodY, cx[c], yT-8*s); }
  ctx.strokeStyle = "#64748b";
  for (const c of [0,1]){
    ctx.globalAlpha = press(c);      // feed + product path open while adsorbing
    pipe(xL, feedY, cx[c], feedY);
    pipe(cx[c], feedY, cx[c], yB+8*s);
    pipe(cx[c], yT-8*s, cx[c], prodY);
    pipe(cx[c], prodY, xR, prodY);
    ctx.globalAlpha = 1 - press(c);  // blowdown path open while regenerating
    pipe(cx[c], yB+8*s, cx[c], offY);
    pipe(cx[c], offY, xR, offY);
  }
  ctx.globalAlpha = 1;
  // domed column shells + adsorbent beads
  for (const c of [0,1]){
    const x0 = cx[c]-cw/2, x1 = cx[c]+cw/2;
    ctx.beginPath();
    ctx.moveTo(x0, yT+10*s);
    ctx.quadraticCurveTo(x0, yT-10*s, cx[c], yT-10*s);
    ctx.quadraticCurveTo(x1, yT-10*s, x1, yT+10*s);
    ctx.lineTo(x1, yB-10*s);
    ctx.quadraticCurveTo(x1, yB+10*s, cx[c], yB+10*s);
    ctx.quadraticCurveTo(x0, yB+10*s, x0, yB-10*s);
    ctx.closePath();
    ctx.fillStyle = P.colColor; ctx.globalAlpha = 0.06 + 0.08*press(c);
    ctx.fill();
    ctx.globalAlpha = 1; ctx.strokeStyle = P.colColor; ctx.lineWidth = 3*s; ctx.stroke();
    for (let bi=0; bi<nBeads; bi++){
      const bp = beadPos(c,bi);
      ctx.fillStyle = shade(P.bedColor, (bi%2)*22);
      ctx.beginPath(); ctx.arc(bp[0],bp[1],bR,0,7); ctx.fill();
    }
  }
  // pressure gauges: the needle swings between L and H each half cycle
  for (const c of [0,1]){
    const gx = cx[c]-cw/2-26*s, gy = yT+16*s, gr = 15*s;
    ctx.strokeStyle = "#64748b"; ctx.lineWidth = 2*s;
    ctx.beginPath(); ctx.moveTo(gx+gr, gy); ctx.lineTo(cx[c]-cw/2, gy); ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.strokeStyle = "#475569";
    ctx.beginPath(); ctx.arc(gx,gy,gr,0,7); ctx.fill(); ctx.stroke();
    text(ctx,"L",gx-gr*0.55,gy+gr*0.5,{size:7.5*s,color:"#94a3b8"});
    text(ctx,"H",gx+gr*0.55,gy+gr*0.5,{size:7.5*s,color:"#94a3b8"});
    const ga = lerp(2.55, 0.6, press(c));
    ctx.strokeStyle = "#dc2626"; ctx.lineWidth = 2*s;
    ctx.beginPath(); ctx.moveTo(gx,gy); ctx.lineTo(gx+Math.cos(ga)*gr*0.7, gy-Math.sin(ga)*gr*0.7); ctx.stroke();
    ctx.fillStyle = "#475569"; ctx.beginPath(); ctx.arc(gx,gy,2.2*s,0,7); ctx.fill();
  }
  // gas B: flies in with the feed and sticks to a bead while its column is at
  // high P; when the column blows down it releases and leaves as off-gas
  for (let i=0;i<P.nB;i++){
    const c = i % 2, q = i*11+31, jx = cx[c];
    const tb = beadPos(c, Math.floor(rnd(q+1)*nBeads));
    const bx = tb[0] + (rnd(q+7)*2-1)*6*s, by = tb[1] - 4*s + (rnd(q+8)*2-1)*5*s;
    let x, y, sf;
    if ((t < 0.5) === (c === 0)){
      const p = clamp((uh - 0.05 - 0.45*rnd(q+2))/0.32, 0, 1);
      const L1 = jx - xIn, L2 = feedY - yB, L3 = yB - by;
      const d = smooth(p)*(L1+L2+L3+Math.abs(bx-jx));
      if (d < L1){ x = xIn + d; y = feedY; }
      else if (d < L1+L2){ x = jx; y = feedY - (d-L1); }
      else if (d < L1+L2+L3){ x = jx; y = yB - (d-L1-L2); }
      else { x = jx + Math.sign(bx-jx)*(d-L1-L2-L3); y = by; }
      sf = smooth((p-0.85)/0.15);
    } else {
      const p = clamp((uh - 0.06 - 0.4*rnd(q+3))/0.34, 0, 1);
      const L1 = Math.abs(bx - jx), L2 = offY - by;
      const d = smooth(p)*(L1+L2+xOut-jx);
      if (d < L1){ x = bx - Math.sign(bx-jx)*d; y = by; }
      else if (d < L1+L2){ x = jx; y = by + (d-L1); }
      else { x = jx + (d-L1-L2); y = offY; }
      sf = 1 - smooth(p/0.12);
    }
    x += Math.sin(6.283*(3*t + rnd(q+4)))*1.4*s*sf;
    y += Math.cos(6.283*(2*t + rnd(q+5)))*1.4*s*sf;
    drawGasMol(ctx, gB, x, y, s, 0);
  }
  // gas A: streams through the adsorbing column to the product line, fading
  // out around the half-cycle boundary while the valves switch over
  const aWin = smooth(Math.min(uh, 1-uh)/0.09);
  const jx = cx[adsCol];
  const A1 = jx - xIn, A2 = feedY - yB, A3 = yB - yT, A4 = yT - prodY;
  const tot = A1+A2+A3+A4+xOut-jx;
  ctx.globalAlpha = aWin;
  for (let i=0;i<P.nA;i++){
    const q = i*7+13;
    const d = ((rnd(q) + uh*(P.speed+1)) % 1) * tot;
    let x, y;
    if (d < A1){ x = xIn + d; y = feedY; }
    else if (d < A1+A2){ x = jx; y = feedY - (d-A1); }
    else if (d < A1+A2+A3){
      y = yB - (d-A1-A2);
      x = jx + Math.sin((yB-y)/(26*s) + rnd(q+5)*6.283) * cw*0.26;
    }
    else if (d < A1+A2+A3+A4){ x = jx; y = yT - (d-A1-A2-A3); }
    else { x = jx + (d-A1-A2-A3-A4); y = prodY; }
    drawGasMol(ctx, gA, x, y, s, 0);
  }
  ctx.globalAlpha = 1;
  // labels + stream arrows ("auto" composes from the selected gases)
  const feedLabel = P.feedLabel === "auto" ? gA.label+" + "+gB.label+" feed" : P.feedLabel;
  const prodLabel = P.prodLabel === "auto" ? gA.label+" product" : P.prodLabel;
  const offLabel  = P.offLabel  === "auto" ? gB.label+"-rich off-gas" : P.offLabel;
  arrow(ctx, xL, feedY, xL+40*s, feedY, "#334155", 3.5*s, 9*s);
  text(ctx, feedLabel, W*0.035, feedY-17*s, {size:14.5*s, bold:true, color:"#334155", align:"left"});
  arrow(ctx, xR-34*s, prodY, xR, prodY, gA.tint, 3.5*s, 9*s);
  text(ctx, prodLabel, W*0.965, prodY-16*s, {size:14.5*s, bold:true, color:gA.tint, align:"right"});
  arrow(ctx, xR-34*s, offY, xR, offY, gB.tint, 3.5*s, 9*s);
  text(ctx, offLabel, W*0.965, offY-15*s, {size:14.5*s, bold:true, color:gB.tint, align:"right"});
  // column state labels crossfade at each swap
  for (const c of [0,1]){
    const p = press(c);
    if (p > 0.02){ ctx.globalAlpha = p; text(ctx, P.hiLabel, cx[c], H*0.79, {size:12.5*s, bold:true, color:"#b91c1c"}); }
    if (p < 0.98){ ctx.globalAlpha = 1-p; text(ctx, P.loLabel, cx[c], H*0.79, {size:12.5*s, bold:true, color:"#1d4ed8"}); }
    ctx.globalAlpha = 1;
  }
  ctx.strokeStyle = "#64748b"; ctx.lineWidth = 1.5*s;
  ctx.beginPath(); ctx.moveTo(cx[0]-cw/2-2*s, H*0.52); ctx.lineTo(W*0.145, H*0.56); ctx.stroke();
  text(ctx, P.bedLabel, W*0.03, H*0.585, {size:12.5*s, color:"#334155", align:"left"});
}

// normal boiling points (K) at 1 atm, for the temperature-gradient labels
const BP_K = {H2:20, He:4, N2:77, O2:90, CO:82, CH4:112, CO2:195, H2O:373};
// pairs whose real column does not run at 1 atm get their own feed and
// temperature labels. CO2 has no liquid at 1 atm, so H2/CO2 is shown at
// ~30 bar: top just above the CO2 triple point (216.6 K), sump at the CO2
// boiling point for that pressure; H2 stays non-condensable throughout.
const CRYO_PRESET = {
  "H2|CO2": {feed:"H₂ + CO₂ feed, ~30 bar", tTop:"≈ 223 K", subTop:"−50 °C · colder", tBot:"≈ 268 K", subBot:"−5 °C · warmer"},
  "N2|O2":  {feed:"compressed air"},
};
function polyLen(pts){
  let L = 0;
  for (let i=1;i<pts.length;i++) L += Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]);
  return L;
}
function polyAt(pts,d){ // point at arc length d along a polyline, plus the segment index
  for (let i=1;i<pts.length;i++){
    const [x0,y0] = pts[i-1], [x1,y1] = pts[i];
    const L = Math.hypot(x1-x0, y1-y0);
    if (d <= L || i === pts.length-1){ const u = L ? clamp(d/L,0,1) : 0; return [lerp(x0,x1,u), lerp(y0,y1,u), i]; }
    d -= L;
  }
  return [...pts[pts.length-1], pts.length-1];
}

function drawCryo(ctx,t,P,W,H){
  const s = Math.min(W/720, H/800);
  const gL = GASES[P.gasL], gH = GASES[P.gasH];
  // tray column: the more volatile gas L rises as vapour to the condenser,
  // the less volatile gas H runs down tray by tray as liquid to the sump
  const N = P.trays, k = 2*Math.max(1, Math.floor(N/4));   // feed tray; even, so reflux lands on the right
  const cx = W*0.42, cw = 150*s, colL = cx-cw/2, colR = cx+cw/2;
  const yTop = H*0.17, yBot = H*0.80, dome = 16*s;
  const ySump = yBot - 44*s, yT0 = yTop + 40*s, yTn = ySump - 46*s;
  const pitch = (yTn - yT0)/(N-1), liqD = 10*s, dcW = 26*s;
  const yp = j => yT0 + j*pitch;                          // plate height
  const side = j => ((j - k) & 1) ? 1 : -1;               // downcomer side (-1 = left)
  const xWeir = j => cx + side(j)*(cw/2 - dcW);
  const xDc = j => cx + side(j)*(cw/2 - dcW/2);
  const yOH = H*0.075, xC0 = W*0.58, xC1 = W*0.74, xRf = xC0 + 20*s;
  const yFeed = yp(k) - liqD - 14*s, yProd = H*0.92;
  const xHX0 = W*0.04, xHX1 = W*0.16, xV = W*0.23;
  const mix = (f,w) => { const a = hex2rgb(gL.tint), b = hex2rgb(gH.tint);
    return `rgb(${[0,1,2].map(i => Math.round(lerp(lerp(a[i],b[i],f),255,w))).join(",")})`; };
  const trayF = j => (j+1)/(N+1);                         // liquid gets richer in H going down
  const pipe = (pts,col,w) => { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for (const p of pts.slice(1)) ctx.lineTo(p[0],p[1]); ctx.stroke(); };
  const zigzag = (x0,x1,y,amp,n,col) => { ctx.strokeStyle = col; ctx.lineWidth = 1.8*s; ctx.beginPath();
    for (let i=0;i<=n;i++){ const x = lerp(x0,x1,i/n), yy = y + (i%2 ? -amp : amp); i ? ctx.lineTo(x,yy) : ctx.moveTo(x,yy); }
    ctx.stroke(); };

  // ---- piping: warm feed gray, cold side blue
  const yRf = yp(0) - liqD - 12*s;
  pipe([[-10,yFeed],[xHX0,yFeed]], "#cbd5e1", 5*s);
  pipe([[xHX1,yFeed],[colL,yFeed]], "#93c5fd", 5*s);
  pipe([[cx,yTop-dome],[cx,yOH],[xC0,yOH]], "#93c5fd", 5*s);
  pipe([[xC1,yOH],[W+10,yOH]], "#93c5fd", 5*s);
  pipe([[xRf,yOH+20*s],[xRf,yRf],[colR,yRf]], mix(0.1,0.35), 4*s);
  pipe([[cx,yBot+dome],[cx,yProd],[W+10,yProd]], mix(1,0.35), 5*s);

  // ---- main heat exchanger and J-T expansion valve
  ctx.fillStyle = "#f1f5f9"; ctx.strokeStyle = "#475569"; ctx.lineWidth = 2*s;
  ctx.beginPath(); ctx.roundRect(xHX0, yFeed-17*s, xHX1-xHX0, 34*s, 5*s); ctx.fill(); ctx.stroke();
  zigzag(xHX0+6*s, xHX1-6*s, yFeed, 9*s, 10, "#60a5fa");
  ctx.fillStyle = "#475569";
  ctx.beginPath(); ctx.moveTo(xV-10*s,yFeed-8*s); ctx.lineTo(xV+10*s,yFeed+8*s); ctx.lineTo(xV+10*s,yFeed-8*s);
  ctx.lineTo(xV-10*s,yFeed+8*s); ctx.closePath(); ctx.fill();
  ctx.fillRect(xV-1*s, yFeed-16*s, 2*s, 8*s); ctx.fillRect(xV-6*s, yFeed-18*s, 12*s, 3*s);

  // ---- overhead condenser with coolant in/out
  ctx.fillStyle = "#e0f2fe"; ctx.strokeStyle = "#475569"; ctx.lineWidth = 2*s;
  ctx.beginPath(); ctx.roundRect(xC0, yOH-20*s, xC1-xC0, 40*s, 18*s); ctx.fill(); ctx.stroke();
  zigzag(xC0+14*s, xC1-14*s, yOH, 10*s, 8, "#38bdf8");
  arrow(ctx, xC1-22*s, yOH-36*s, xC1-22*s, yOH-21*s, "#0284c7", 2*s, 6*s);
  arrow(ctx, xC0+22*s, yOH-21*s, xC0+22*s, yOH-36*s, "#0284c7", 2*s, 6*s);

  // ---- column shell and sump
  const shell = () => { ctx.beginPath();
    ctx.moveTo(colL, yTop+dome); ctx.quadraticCurveTo(colL, yTop-dome, cx, yTop-dome);
    ctx.quadraticCurveTo(colR, yTop-dome, colR, yTop+dome); ctx.lineTo(colR, yBot-dome);
    ctx.quadraticCurveTo(colR, yBot+dome, cx, yBot+dome); ctx.quadraticCurveTo(colL, yBot+dome, colL, yBot-dome);
    ctx.closePath(); };
  shell(); ctx.fillStyle = "#f8fafc"; ctx.fill();
  ctx.save(); shell(); ctx.clip();
  ctx.fillStyle = mix(1,0.6); ctx.fillRect(colL, ySump, cw, yBot+dome-ySump);
  ctx.restore();
  const yCoil = ySump + 24*s;                             // reboiler coil
  zigzag(colR, colL+18*s, yCoil, 6*s, 12, "#dc2626");
  const bubble = (x,y,r,a) => { ctx.globalAlpha = a; ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.3*s;
    ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.stroke(); ctx.globalAlpha = 1; };
  for (let b=0;b<10;b++){
    const ph = (rnd(b*13+5) + 2*t) % 1;
    bubble(lerp(colL+22*s, colR-10*s, rnd(b*13+1)), yCoil - ph*(yCoil-ySump-3*s), (1.5+1.8*ph)*s, 1-ph*0.7);
  }

  // ---- trays: liquid pool with a moving surface, plate, weir + downcomer apron
  for (let j=0;j<N;j++){
    const f = trayF(j), sd = side(j), y = yp(j), xw = xWeir(j);
    const xa = sd < 0 ? xw : colL, xb = sd < 0 ? colR : xw;
    const yNext = j < N-1 ? yp(j+1) : ySump;
    const dx0 = sd < 0 ? colL : xw, dx1 = sd < 0 ? xw : colR, yDc = lerp(y, yNext, 0.55);
    ctx.fillStyle = mix(f,0.62);
    ctx.fillRect(dx0, yDc, dx1-dx0, yNext - yDc);         // liquid backed up in the downcomer
    ctx.beginPath(); ctx.moveTo(xa, y);
    for (let x = xa; x <= xb+0.1; x += 5*s)
      ctx.lineTo(x, y - liqD + Math.sin(6.283*2*t + x/(12*s) + j*1.7)*1.4*s);
    ctx.lineTo(xb, y); ctx.closePath(); ctx.fill();
    for (let b=0;b<6;b++){
      const ph = (rnd(j*31+b+7) + 2*t) % 1;
      bubble(lerp(xa+8*s, xb-8*s, rnd(j*31+b)), y - 1.5*s - ph*(liqD-3*s), (1+1.3*ph)*s, 1-ph*0.6);
    }
    ctx.strokeStyle = P.colColor; ctx.lineCap = "butt";
    ctx.lineWidth = 3*s; ctx.beginPath(); ctx.moveTo(xa, y); ctx.lineTo(xb, y); ctx.stroke();
    ctx.lineWidth = 2*s; ctx.beginPath();
    ctx.moveTo(xw, y - liqD - 2*s); ctx.lineTo(xw, j < N-1 ? yNext - liqD - 5*s : ySump + 4*s); ctx.stroke();
  }
  shell(); ctx.strokeStyle = P.colColor; ctx.lineWidth = 3*s; ctx.stroke();

  // ---- reflux droplets run back from the condenser onto the top tray
  const rfPts = [[xRf,yOH+20*s],[xRf,yRf],[colR-6*s,yRf],[colR-14*s,yp(0)-liqD]];
  const rfL = polyLen(rfPts);
  ctx.fillStyle = mix(0.1,0.2);
  for (let i=0;i<6;i++){
    const u = (i/6 + 2*t) % 1, [x,y] = polyAt(rfPts, u*rfL);
    ctx.globalAlpha = smooth(u/0.08)*smooth((1-u)/0.08);  // fade at both ends: no pop at the wrap
    ctx.beginPath(); ctx.arc(x,y,2.6*s,0,7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // ---- molecules (each walks its own closed route once per loop)
  const tumble = (q,i) => 6.283*(rnd(q+9) + (i%2 ? 1 : -1)*t);
  const lane = cw/2 - dcW - 10*s;
  for (let i=0;i<P.nH;i++){                               // heavy: across each tray, down each downcomer
    const q = i*17+41;
    const pts = [[-30*s,yFeed],[colL+6*s,yFeed],[cx + lerp(-lane*0.3, lane, rnd(q+1)), yp(k)-liqD/2]];
    for (let j=k;j<N;j++){
      const sd = side(j);
      pts.push([xWeir(j) - sd*5*s, yp(j)-liqD/2], [xWeir(j), yp(j)-liqD-3*s], [xDc(j), yp(j)-liqD+2*s]);
      pts.push(j < N-1 ? [xDc(j), yp(j+1)-liqD/2] : [xDc(j), ySump+12*s]);
    }
    pts.push([cx, ySump+30*s],[cx, yProd],[W+30*s, yProd]);
    const [x,y] = polyAt(pts, ((rnd(q) + t*P.speed) % 1)*polyLen(pts));
    drawGasMol(ctx, gH, x, y, s, tumble(q,i));
  }
  for (let i=0;i<P.nL;i++){                               // light: straight up through the trays as vapour
    const q = i*13+7, ox = (rnd(q+1)*2-1)*lane;
    const pts = [[-30*s,yFeed],[colL+6*s,yFeed],[cx+ox, yFeed-22*s],[cx+ox, yTop+6*s],
                 [cx, yTop-dome+4*s],[cx, yOH],[xC1, yOH],[W+30*s, yOH]];
    let [x,y,seg] = polyAt(pts, ((rnd(q) + t*P.speed) % 1)*polyLen(pts));
    if (seg === 3) x += Math.sin(y/(9*s) + rnd(q+3)*6.283)*3*s;
    drawGasMol(ctx, gL, x, y, s, tumble(q,i));
  }

  // ---- labels ("auto" composes from the selected gases)
  const pre = CRYO_PRESET[P.gasL+"|"+P.gasH] || {};
  const feedLabel = P.feedLabel === "auto" ? (pre.feed || gL.label+" + "+gH.label+" feed") : P.feedLabel;
  const topLabel  = P.topLabel  === "auto" ? gL.label+" product (top)" : P.topLabel;
  const botLabel  = P.botLabel  === "auto" ? "liquid "+gH.label+" (bottoms)" : P.botLabel;
  const lab = "#334155";
  text(ctx, feedLabel, W*0.02, yFeed-34*s, {size:14.5*s, bold:true, color:lab, align:"left"});
  text(ctx, P.hxLabel, (xHX0+xHX1)/2, yFeed+30*s, {size:11.5*s, color:lab});
  text(ctx, P.valveLabel, xV, yFeed+30*s, {size:11.5*s, color:lab});
  arrow(ctx, W-40*s, yOH, W-6*s, yOH, gL.tint, 3.5*s, 9*s);
  text(ctx, topLabel, W*0.975, yOH+22*s, {size:14.5*s, bold:true, color:gL.tint, align:"right"});
  arrow(ctx, W-40*s, yProd, W-6*s, yProd, gH.tint, 3.5*s, 9*s);
  text(ctx, botLabel, W*0.975, yProd-17*s, {size:14.5*s, bold:true, color:gH.tint, align:"right"});
  text(ctx, P.condLabel, (xC0+xC1)/2, yOH-44*s, {size:11.5*s, color:lab});
  text(ctx, "reflux", xRf+8*s, (yOH+yRf)/2+12*s, {size:11.5*s, color:lab, align:"left"});
  arrow(ctx, colR+44*s, yCoil, colR+6*s, yCoil, "#dc2626", 2.5*s, 7*s);
  text(ctx, P.rebLabel, colR+50*s, yCoil, {size:11.5*s, color:"#b91c1c", align:"left"});
  const bx = colL-14*s;                                   // section brackets
  const bracket = (y0,y1,str) => {
    ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 1.5*s; ctx.beginPath();
    ctx.moveTo(bx+6*s,y0); ctx.lineTo(bx,y0); ctx.lineTo(bx,y1); ctx.lineTo(bx+6*s,y1); ctx.stroke();
    text(ctx, str, bx-8*s, (y0+y1)/2, {size:12.5*s, bold:true, color:"#475569", align:"right"});
  };
  bracket(yp(0)-liqD-4*s, yFeed-48*s, P.rectLabel);
  bracket(yFeed+44*s, ySump-4*s, P.stripLabel);
  if (P.showT){                                           // coldest at the top, warmest at the sump
    const tx = W*0.80, ty0 = yp(0), ty1 = yp(N-1), tw = 10*s;
    const gr = ctx.createLinearGradient(0, ty0, 0, ty1);
    gr.addColorStop(0, "#bfdbfe"); gr.addColorStop(1, "#fca5a5");
    ctx.fillStyle = gr; ctx.strokeStyle = "#64748b"; ctx.lineWidth = 1.2*s;
    ctx.beginPath(); ctx.roundRect(tx-tw/2, ty0, tw, ty1-ty0, tw/2); ctx.fill(); ctx.stroke();
    const tL = BP_K[P.gasL], tH = BP_K[P.gasH];
    const tTop = pre.tTop || (tL ? "≈ "+tL+" K" : "cold"), tBot = pre.tBot || (tH ? "≈ "+tH+" K" : "warm");
    text(ctx, tTop, tx+12*s, ty0+6*s, {size:13*s, bold:true, color:"#1d4ed8", align:"left"});
    text(ctx, pre.subTop || "colder", tx+12*s, ty0+22*s, {size:11*s, color:"#64748b", align:"left"});
    text(ctx, tBot, tx+12*s, ty1-6*s, {size:13*s, bold:true, color:"#b91c1c", align:"left"});
    text(ctx, pre.subBot || "warmer", tx+12*s, ty1-22*s, {size:11*s, color:"#64748b", align:"left"});
    ctx.save(); ctx.translate(tx-16*s, (ty0+ty1)/2); ctx.rotate(-Math.PI/2);
    text(ctx, "temperature", 0, 0, {size:11.5*s, color:"#64748b"}); ctx.restore();
  }
}

/* ---- shared bits for the syngas templates (SMR, coal gasification) ---- */
// Flow speeds below 1x. At 1x a mover crosses its whole path once per loop;
// to go slower and still loop seamlessly, each mover gets m = 1/speed copies
// that share everything but their phase (spaced 1/m apart). Copy s always
// holds the s-th slot along the path, phase in [s/m, (s+1)/m): copies are then
// drawn in path order, so where two overlap the same one stays on top and the
// loop closes pixel-for-pixel. Counts round up to whole groups of m.
const SLOW_SPEEDS = [["0.25","¼× (slowest)"],["0.333","⅓×"],["0.5","½×"],["1","1×"],["2","2×"],["3","3×"]];
function flowM(v){ return v < 1 ? Math.round(1/v) : 1; }
function flowCount(n, v){ const m = flowM(v); return Math.ceil(n/m)*m; }
function flowPhase(r, i, v, t){
  const m = flowM(v), u = m*r + (v < 1 ? 1 : v)*t;
  return (u - Math.floor(u) + i % m)/m;
}
function strokePath(ctx,pts,col,w){
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for (const p of pts.slice(1)) ctx.lineTo(p[0],p[1]);
  ctx.stroke();
}
function zigLine(ctx,x0,x1,y,amp,n,col,lw){
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath();
  for (let i=0;i<=n;i++){ const x = lerp(x0,x1,i/n), yy = y + (i%2 ? -amp : amp); i ? ctx.lineTo(x,yy) : ctx.moveTo(x,yy); }
  ctx.stroke();
}
// teardrop flame rooted at (x,y), pointing along dir (+1 down, -1 up); flick in [-1,1]
function flame(ctx,x,y,w,h,dir,flick){
  const hh = h*(0.86 + 0.14*flick);
  for (const [c,k] of [["#f97316",1],["#fbbf24",0.64],["#fef3c7",0.32]]){
    const ww = w*k, h2 = hh*k;
    ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(x-ww/2, y);
    ctx.bezierCurveTo(x-ww/2, y+dir*h2*0.5, x-ww*0.12, y+dir*h2*0.8, x, y+dir*h2);
    ctx.bezierCurveTo(x+ww*0.12, y+dir*h2*0.8, x+ww/2, y+dir*h2*0.5, x+ww/2, y);
    ctx.closePath(); ctx.fill();
  }
}
function glow(ctx,x,y,r,a){
  if (a <= 0) return;
  const g = ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0, `rgba(253,224,71,${0.9*a})`); g.addColorStop(1, "rgba(253,224,71,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
}
function packedBed(ctx,x0,y0,x1,y1,r,col,seed){
  const nx = Math.max(1, Math.floor((x1-x0)/(2.4*r))), ny = Math.max(1, Math.floor((y1-y0)/(2.2*r)));
  for (let j=0;j<ny;j++) for (let i=0;i<nx;i++){
    const off = (j%2) ? 0.5 : 0;
    const x = x0 + (i+0.5+off*(i<nx-1?1:0))*(x1-x0)/nx, y = y0 + (j+0.5)*(y1-y0)/ny;
    ctx.fillStyle = shade(col, ((i+j+seed)%3)*14 - 10);
    ctx.globalAlpha = 0.5;                                  // pale, so the gas stays readable on top
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ---- steam methane reforming: reformer furnace -> waste-heat boiler -> shift ---- */
// each packet carries CH4 + 2 H2O; slots keep their order so every molecule
// changes species in place as it crosses a reaction front
const SMR_SLOTS = [["CH4","H2O","H2O"], ["CO","H2","H2O","H2","H2"], ["CO2","H2","H2","H2","H2"]];
// Size sliders move shapes relative to one another, so these templates lay
// themselves out in design units (1 unit = 1 px at the default canvas), work
// out how much room that needs, then scale the whole drawing to fit the
// canvas and clip to it. Growing a part pushes its neighbours aside instead
// of running into them; the drawing shrinks a little to make room.
const TAU = 2*Math.PI;
function fitLayout(ctx,W,H,VW,VH,BW,BH){
  const f = Math.min(W/BW, H/BH, W/VW, H/VH);         // shrink to make room, never enlarge past the base scale
  ctx.save();
  ctx.translate((W-VW*f)/2, (H-VH*f)/2); ctx.scale(f, f);
  ctx.beginPath(); ctx.rect(0, 0, VW, VH); ctx.clip();
}

function drawSMR(ctx,t,P,W,H){
  const k = key => P[key]/100;
  const kFw = k("furnW"), kFh = k("furnH"), kT = k("tubeSize"), kFl = k("flameSize"), kC = k("pelletSize"),
        kB = k("boilerSize"), kSw = k("shiftW"), kSh = k("shiftH"), kM = k("molSize"), kP = k("pipeSize"), kX = k("textSize");
  const nT = P.tubes, lab = "#334155";
  // ---- layout, left to right and top to bottom
  const fx0 = 136, fx1 = fx0 + 288*kFw, fy0 = 112, fy1 = fy0 + 336*kFh;
  const yH = fy0 - 39, yP = yH;
  const pitch = (fx1-fx0)/nT, tw = Math.min(22*kT, pitch*0.75);
  const xT = i => fx0 + (i+0.5)*pitch;
  const bw = 56*kB, bh = 30*kB;
  const sw = 60*kSw, sd = 14*kSw, sh = 224*kSh;
  const xB = fx1 + 40 + bw/2;
  const xS = Math.max(xB + bw/2 + 26 + sw/2, fx1 + 122*kX + sw/2);
  const xL = xS + sw/2 + 12;                              // shift labels
  let yS0 = (fy0+fy1)/2 + 22 - sh/2;
  yS0 = Math.max(yS0, yP + 30 + sd);                      // keep the dome below the product line
  const yS1 = yS0 + sh;
  const yC = Math.max(fy1 + 45, yS1 + sd + 30);
  const VW = xL + 150*kX + 32, VH = yC + 30 + 37*kX;
  fitLayout(ctx, W, H, VW, VH, 800, 560);
  W = VW; H = VH;

  // furnace box, glowing firebox
  const fg = ctx.createLinearGradient(0, fy0, 0, fy1);
  fg.addColorStop(0, "#fed7aa"); fg.addColorStop(1, "#fff7ed");
  ctx.fillStyle = fg; ctx.fillRect(fx0, fy0, fx1-fx0, fy1-fy0);
  // piping
  strokePath(ctx, [[-10,yH],[xT(nT-1),yH]], "#94a3b8", 6*kP);
  strokePath(ctx, [[xT(0),yC],[xS,yC],[xS,yS1+sd]], "#94a3b8", 6*kP);
  strokePath(ctx, [[xS,yS0-sd],[xS,yP],[W+10,yP]], "#94a3b8", 6*kP);
  // burners on the roof, flames between the tubes (clipped to the firebox)
  ctx.save(); ctx.beginPath(); ctx.rect(fx0, fy0-30, fx1-fx0, fy1-fy0+30); ctx.clip();
  for (let i=0;i<=nT;i++){
    const x = lerp(fx0+16, fx1-16, i/nT);
    arrow(ctx, x, fy0-22, x, fy0-8, "#78716c", 2, 5);
    ctx.fillStyle = "#57534e"; ctx.fillRect(x-7, fy0-5, 14, 9);
    flame(ctx, x, fy0+4, 18*kFl, 78*kFl, 1, Math.sin(TAU*3*t + i*1.9));
  }
  ctx.restore();
  // catalyst tubes
  const pr = Math.min(3.6*kC, (tw-4)/2.2);
  for (let i=0;i<nT;i++){
    const x = xT(i);
    ctx.fillStyle = "#f1f5f9"; ctx.fillRect(x-tw/2, yH, tw, yC-yH);
    packedBed(ctx, x-tw/2+2, fy0+4, x+tw/2-2, fy1-4, pr, P.catColor, i);
    ctx.strokeStyle = P.tubeColor; ctx.lineWidth = 2; ctx.strokeRect(x-tw/2, yH, tw, yC-yH);
  }
  ctx.strokeStyle = P.wallColor; ctx.lineWidth = 8; ctx.strokeRect(fx0, fy0, fx1-fx0, fy1-fy0);
  // flue gas leaves the bottom of the firebox
  const yFlue = Math.min(fy1-22, yC-bh/2-28*kX);          // stays clear of the boiler label
  arrow(ctx, fx1+4, yFlue, fx1+46, yFlue, "#a8a29e", 3, 8);
  text(ctx, P.flueLabel, fx1+52, yFlue, {size:11.5*kX, color:"#78716c", align:"left"});
  // waste-heat boiler
  ctx.fillStyle = "#f8fafc"; ctx.strokeStyle = "#475569"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(xB-bw/2, yC-bh/2, bw, bh, 5*kB); ctx.fill(); ctx.stroke();
  zigLine(ctx, xB-bw/2+6*kB, xB+bw/2-6*kB, yC, bh*0.27, 8, "#60a5fa", 1.8);
  // shift reactor
  ctx.beginPath();
  ctx.moveTo(xS-sw/2, yS0); ctx.quadraticCurveTo(xS-sw/2, yS0-sd, xS, yS0-sd);
  ctx.quadraticCurveTo(xS+sw/2, yS0-sd, xS+sw/2, yS0); ctx.lineTo(xS+sw/2, yS1);
  ctx.quadraticCurveTo(xS+sw/2, yS1+sd, xS, yS1+sd); ctx.quadraticCurveTo(xS-sw/2, yS1+sd, xS-sw/2, yS1);
  ctx.closePath(); ctx.fillStyle = "#f8fafc"; ctx.fill();
  packedBed(ctx, xS-sw/2+4, yS0+4, xS+sw/2-4, yS1-4, Math.min(5*kC, (sw-8)/2.4), P.shiftColor, 1);
  ctx.strokeStyle = "#475569"; ctx.lineWidth = 3; ctx.stroke();

  // gas packets
  const gap = 14*kM, ms = 0.9*kM, gl = 16*kM, xStart = -40;
  const V = parseFloat(P.speed), M = flowM(V);
  for (let i=0;i<flowCount(P.nPack, V);i++){
    const g = Math.floor(i/M), q = g*19+3, x = xT(g % nT);
    const pts = [[xStart,yH],[x,yH],[x,yC],[xS,yC],[xS,yS0-sd],[xS,yP],[W+90*kM,yP]];
    const L = polyLen(pts);
    const dR = (x-xStart) + lerp(fy0+30, fy1-70, rnd(q+1)) - yH;
    const dS = (x-xStart) + (yC-yH) + (xS-x) + (yC - lerp(yS1-24, yS0+40, rnd(q+2)));
    const head = flowPhase(rnd(q), i, V, t)*(L + 5*gap);
    for (let m=0;m<5;m++){
      const dm = head - m*gap;
      if (dm < 0 || dm > L) continue;
      const st = dm < dR ? 0 : dm < dS ? 1 : 2;
      const sp = SMR_SLOTS[st][m];
      if (!sp) continue;
      const [px,py] = polyAt(pts, dm);
      // flash where a molecule changes species
      if (m <= 1 && Math.abs(dm-dR) < gl) glow(ctx, px, py, gl, 1-Math.abs(dm-dR)/gl);
      if ((m === 0 || m === 2) && Math.abs(dm-dS) < gl) glow(ctx, px, py, gl, 1-Math.abs(dm-dS)/gl);
      ctx.globalAlpha = (st === 1 && m >= 3) ? smooth((dm-dR)/(18*kM)) : 1;   // new H2 fades in
      drawGasMol(ctx, GASES[sp], px, py, ms, TAU*(rnd(q+m) + (m%2 ? 1 : -1)*t));
      ctx.globalAlpha = 1;
    }
  }

  // labels
  arrow(ctx, 4, yH, 40, yH, lab, 3, 8);
  text(ctx, P.feedLabel, 16, yH-20*kX, {size:14.5*kX, bold:true, color:lab, align:"left"});
  arrow(ctx, W-40, yP, W-6, yP, "#2563eb", 3.5, 9);
  text(ctx, P.prodLabel, W-20, yP-20*kX, {size:14.5*kX, bold:true, color:"#2563eb", align:"right"});
  text(ctx, P.fuelLabel, fx1+10, fy0-14, {size:11.5*kX, color:"#78716c", align:"left"});
  text(ctx, P.whbLabel, xB, yC-bh/2-10*kX, {size:11.5*kX, color:lab});
  const cxF = (fx0+fx1)/2;
  text(ctx, P.refLabel, cxF, yC+31*kX, {size:12.5*kX, bold:true, color:P.wallColor});
  text(ctx, P.shiftLabel, xL, yS0+10*kX, {size:12.5*kX, bold:true, color:lab, align:"left"});
  text(ctx, P.shiftCat, xL, yS0+28*kX, {size:11.5*kX, color:"#64748b", align:"left"});
  if (P.showEq){
    text(ctx, "CH₄ + H₂O → CO + 3 H₂   ΔH° = +206 kJ/mol", cxF, yC+53*kX, {size:12*kX, color:lab});
    text(ctx, "CO + H₂O → CO₂ + H₂", xL, yS0+54*kX, {size:12*kX, color:lab, align:"left"});
    text(ctx, "ΔH° = −41 kJ/mol", xL, yS0+71*kX, {size:12*kX, color:lab, align:"left"});
  }
  ctx.restore();
}

/* ---- coal gasification: entrained-flow, slagging, water quench, shift ---- */
function drawGasifier(ctx,t,P,W,H){
  const k = key => P[key]/100;
  const kV = k("vesselW"), kVh = k("vesselH"), kFl = k("flameSize"), kSc = k("scrubSize"), kSw = k("shiftW"),
        kSh = k("shiftH"), kM = k("molSize"), kCo = k("coalSize"), kP = k("pipeSize"), kX = k("textSize");
  const lab = "#334155";
  // ---- layout
  const ro = 95*kV, ri = 78*kV, rt = 22*kV, dome = 30*kV;
  const cx = Math.max(209, 125*kX + 32) + ro;             // room for the left-hand labels
  const yF = 48, yTop = Math.max(136, yF + dome + 60);
  const yCone = yTop + 245*kVh, yThr = yCone + 41*kV, yFl = yThr + 10;
  const yW = yFl + 105*kVh, yQ1 = yW + 61*kVh, yOut = yFl + 44*kVh;
  const xCoal = cx-11*kV, xO2 = cx+11*kV, yBurn = yTop-dome-20, yTip = yTop-dome+16;
  const xR = cx+ro+18;                                    // gasifier labels
  const xSc0 = cx+ro+80, xSc1 = xSc0 + 76*kSc, ySc0 = yOut-52*kSc, ySc1 = yOut+42*kSc;
  // water-gas shift reactor: syngas + steam meet at a tee below it, H2 + CO2 leave the top
  const shW = 56*kSw, shD = 12*kSw, yShB = yOut - 68;
  const yP = 116, shH = Math.min(163*kSh, yShB - shD - yP - 30);
  const yShT = yShB - shH;
  const xSh = Math.max(xSc1 + 71 + shW/2, xR + 175*kX);
  const xe = cx+ro+42, yEq = Math.max(yQ1-13, ySc1 + 14 + 30*kX);
  const VW = Math.max(xSh + shW/2 + 78, xe + 262*kX + 10);
  const VH = Math.max(yQ1 + 82, yEq + 54*kX + 20);
  fitLayout(ctx, W, H, VW, VH, 760, 680);
  W = VW; H = VH;
  const shell = () => { ctx.beginPath();
    ctx.moveTo(cx-ro, yTop); ctx.quadraticCurveTo(cx-ro, yTop-dome, cx, yTop-dome);
    ctx.quadraticCurveTo(cx+ro, yTop-dome, cx+ro, yTop); ctx.lineTo(cx+ro, yQ1);
    ctx.quadraticCurveTo(cx+ro, yQ1+24*kV, cx, yQ1+24*kV); ctx.quadraticCurveTo(cx-ro, yQ1+24*kV, cx-ro, yQ1);
    ctx.closePath(); };
  const chamber = () => { ctx.beginPath();
    ctx.moveTo(cx-ri, yTop); ctx.quadraticCurveTo(cx-ri, yTop-dome+14*kV, cx, yTop-dome+14*kV);
    ctx.quadraticCurveTo(cx+ri, yTop-dome+14*kV, cx+ri, yTop);
    ctx.lineTo(cx+ri, yCone); ctx.lineTo(cx+rt, yThr); ctx.lineTo(cx+rt, yFl);
    ctx.lineTo(cx-rt, yFl); ctx.lineTo(cx-rt, yThr); ctx.lineTo(cx-ri, yCone); ctx.closePath(); };

  // feed + product piping
  const pw = 6*kP;
  strokePath(ctx, [[-10,yF],[xCoal,yF],[xCoal,yBurn]], "#a8a29e", pw);
  strokePath(ctx, [[W+10,yF],[xO2,yF],[xO2,yBurn]], "#93c5fd", pw);
  strokePath(ctx, [[cx+ro,yOut],[xSh,yOut],[xSh,yShB+shD]], "#94a3b8", pw);
  strokePath(ctx, [[W+10,yOut],[xSh,yOut]], "#bae6fd", pw);
  strokePath(ctx, [[xSh,yShT-shD],[xSh,yP],[W+10,yP]], "#94a3b8", pw);
  strokePath(ctx, [[cx,yQ1+24*kV],[cx,H+10]], "#78716c", pw);
  // vessel: refractory band (with brick joints), hot chamber, quench section
  ctx.save(); shell(); ctx.clip();
  ctx.fillStyle = P.brickColor; ctx.fillRect(cx-ro, yTop-dome, 2*ro, yFl-yTop+dome);
  ctx.strokeStyle = shade(P.brickColor, 45); ctx.lineWidth = 1;
  for (let y = yTop-dome, r = 0; y < yFl; y += 11, r++){
    ctx.beginPath(); ctx.moveTo(cx-ro, y); ctx.lineTo(cx+ro, y); ctx.stroke();
    for (let x = cx-ro + (r%2)*9; x < cx+ro; x += 18){
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y+11); ctx.stroke(); }
  }
  ctx.fillStyle = "#f1f5f9"; ctx.fillRect(cx-ro, yFl, 2*ro, yQ1+30*kV-yFl);
  ctx.restore();
  const cg = ctx.createLinearGradient(0, yTop-dome, 0, yThr);
  cg.addColorStop(0, "#fdba74"); cg.addColorStop(1, "#fff7ed");
  chamber(); ctx.fillStyle = cg; ctx.fill();
  // burner and flame
  ctx.fillStyle = "#475569"; ctx.fillRect(cx-16*kV, yBurn, 32*kV, yTip-yBurn);
  ctx.save(); chamber(); ctx.clip();
  flame(ctx, cx, yTip, 74*kFl, 170*kFl, 1, Math.sin(TAU*3*t));
  flame(ctx, cx-30*kFl, yTip+4, 30*kFl, 90*kFl, 1, Math.sin(TAU*4*t+1.3));
  flame(ctx, cx+30*kFl, yTip+4, 30*kFl, 90*kFl, 1, Math.sin(TAU*4*t+2.6));
  ctx.restore();
  // scrubber with falling spray
  ctx.fillStyle = "#f8fafc"; ctx.fillRect(xSc0, ySc0, xSc1-xSc0, ySc1-ySc0);
  ctx.fillStyle = "rgba(56,189,248,0.35)"; ctx.fillRect(xSc0, ySc1-14*kSc, xSc1-xSc0, 14*kSc);
  ctx.fillStyle = "#38bdf8";
  for (let i=0;i<14;i++){
    const ph = (rnd(i*7+3) + 2*t) % 1;
    ctx.beginPath(); ctx.arc(lerp(xSc0+6, xSc1-6, rnd(i*7+1)), lerp(ySc0+8, ySc1-16*kSc, ph), 1.8, 0, 7); ctx.fill();
  }
  ctx.strokeStyle = "#475569"; ctx.lineWidth = 2.5; ctx.strokeRect(xSc0, ySc0, xSc1-xSc0, ySc1-ySc0);
  // shift reactor shell + catalyst bed
  ctx.beginPath();
  ctx.moveTo(xSh-shW/2, yShT); ctx.quadraticCurveTo(xSh-shW/2, yShT-shD, xSh, yShT-shD);
  ctx.quadraticCurveTo(xSh+shW/2, yShT-shD, xSh+shW/2, yShT); ctx.lineTo(xSh+shW/2, yShB);
  ctx.quadraticCurveTo(xSh+shW/2, yShB+shD, xSh, yShB+shD); ctx.quadraticCurveTo(xSh-shW/2, yShB+shD, xSh-shW/2, yShB);
  ctx.closePath(); ctx.fillStyle = "#f8fafc"; ctx.fill();
  packedBed(ctx, xSh-shW/2+4, yShT+4, xSh+shW/2-4, yShB-4, Math.min(5, (shW-8)/2.4), P.shiftColor, 1);
  ctx.strokeStyle = "#475569"; ctx.lineWidth = 3; ctx.stroke();

  const swirl = (y,ph) => Math.sin(TAU*y/120 + ph) * (ri-18)
    * clamp((yCone-y)/70,0,1) * clamp((y-yTop)/60,0,1);

  // gaseous products: born in the flame zone, swirl down, through the dip
  // tube and the quench water, out the side to the scrubber and the shift
  const ms = 0.9*kM, gl = 16*kM;
  const gases = [["CO",P.nCO],["H2",P.nH2],["CO2",P.nCO2]];
  const V = parseFloat(P.speed), M = flowM(V);
  let g0 = 0;
  for (const [g,n] of gases) { const nn = flowCount(n, V); for (let i=0;i<nn;i++){
    const gg = Math.floor(i/M), q = (g0+gg)*23+11;
    const bx = cx + (rnd(q+1)*2-1)*Math.max(0, ri-24), by = lerp(yTop+40, yCone-50, rnd(q+2));
    const pts = [[bx,by],[cx,yCone+6],[cx,yFl],[cx,yW+16],[cx+ro*0.62,yW+12],
                 [cx+ro*0.62,yOut],[cx+ro,yOut],[xSh,yOut],[xSh,yShB+shD],
                 [xSh,yShT-shD],[xSh,yP],[W+30*kM,yP]];
    const d = flowPhase(rnd(q), i, V, t)*polyLen(pts);
    let [x,y,seg] = polyAt(pts, d);
    if (seg === 1) x += swirl(y, rnd(q+3)*TAU) * (1 - smooth((y-by)/(yCone-by+1)));
    const spin = TAU*(rnd(q+4) + (gg%2 ? 1 : -1)*t);
    // CO + H2O -> CO2 + H2 somewhere in the shift bed: CO turns into CO2 and
    // a fresh H2 emerges right behind it
    const dS = polyLen(pts.slice(0,9)) + (yShB+shD - lerp(yShB-16, yShT+30, rnd(q+5)));
    let sp = g;
    if (g === "CO" && d >= dS){
      sp = "CO2";
      glow(ctx, x, y, gl, 1 - (d-dS)/gl);
      const d2 = d - 14*kM;
      if (d2 >= dS){
        const [x2,y2] = polyAt(pts, d2);
        ctx.globalAlpha = smooth((d2-dS)/(18*kM));
        drawGasMol(ctx, GASES.H2, x2, y2, ms, -spin);
      }
    }
    ctx.globalAlpha = smooth(d/40);
    drawGasMol(ctx, GASES[sp], x, y, ms, spin);
    ctx.globalAlpha = 1;
  } g0 += nn; }
  // feeds consumed on the way: slurry water and O2 in the flame, steam in the shift bed
  const feedMol = (g, n, pts, seed) => {
    const L = polyLen(pts);
    for (let i=0;i<flowCount(n, V);i++){
      const q = Math.floor(i/M)*29+seed, u = flowPhase(rnd(q), i, V, t);
      if (u > 0.6) continue;
      const d = u/0.6*L, [x,y] = polyAt(pts, d);
      ctx.globalAlpha = 1 - smooth((d-(L-50))/50);
      drawGasMol(ctx, GASES[g], x, y, ms, TAU*(rnd(q+4) + t));
      ctx.globalAlpha = 1;
    }
  };
  feedMol("H2O", P.nH2O, [[-30,yF],[xCoal,yF],[xCoal,yTip],[cx-20,yTop+60]], 5);
  feedMol("O2",  P.nO2,  [[W+30,yF],[xO2,yF],[xO2,yTip],[cx+20,yTop+60]], 7);
  feedMol("H2O", P.nSteam, [[W+30,yOut],[xSh,yOut],[xSh,yShB-20]], 13);
  // coal particles: shrink as they burn, melt to slag at the throat, freeze
  // in the quench water and leave through the bottom
  for (let i=0;i<flowCount(P.nCoal, V);i++){
    const gc = Math.floor(i/M), q = gc*31+17, ph = rnd(q+3)*TAU;
    const pts = [[-30,yF],[xCoal,yF],[xCoal,yTip],[cx,yTop+30],[cx,yCone],[cx,yFl],
                 [cx,yW+30],[cx,yQ1+24*kV],[cx,H+30]];
    const d = flowPhase(rnd(q), i, V, t)*polyLen(pts);
    let [x,y,seg] = polyAt(pts, d);
    if (seg === 4) x += swirl(y, ph);
    const f = seg <= 3 ? 0 : clamp((y-yTop-30)/(yFl-yTop-30), 0, 1);
    const r = lerp(5.5, 2.6, f)*kCo;
    if (y > yW){
      ctx.fillStyle = "#44403c"; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    } else if (f > 0.8){
      ctx.fillStyle = mixColor("#1c1917", "#f97316", smooth((f-0.8)/0.2));
      ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    } else {
      const a0 = TAU*(rnd(q+5) + (gc%2 ? 1 : -1)*t);
      ctx.fillStyle = "#1c1917"; ctx.beginPath();
      for (let v=0;v<7;v++){
        const a = a0 + v*TAU/7, rr = r*(0.75 + 0.4*rnd(q*7+v));
        v ? ctx.lineTo(x+Math.cos(a)*rr, y+Math.sin(a)*rr) : ctx.moveTo(x+Math.cos(a)*rr, y+Math.sin(a)*rr);
      }
      ctx.closePath(); ctx.fill();
    }
  }
  // quench water (drawn over what is submerged), dip tube, shell outline
  ctx.save(); shell(); ctx.clip();
  ctx.fillStyle = "rgba(56,189,248,0.38)"; ctx.fillRect(cx-ro, yW, 2*ro, yQ1+30*kV-yW);
  ctx.strokeStyle = "rgba(255,255,255,0.8)"; ctx.lineWidth = 1.3;
  for (let b=0;b<9;b++){
    const ph = (rnd(b*11+2) + 2*t) % 1, bx = cx + lerp(rt+8, ro-10, rnd(b*11+5))*(b%3 ? 1 : -1);
    ctx.globalAlpha = 1-ph*0.6; ctx.beginPath(); ctx.arc(bx, lerp(yW+30, yW+3, ph), 1.4+1.6*ph, 0, 7); ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.restore();
  ctx.strokeStyle = "#475569"; ctx.lineWidth = 3;
  for (const sx of [-1,1]){ ctx.beginPath(); ctx.moveTo(cx+sx*rt, yFl); ctx.lineTo(cx+sx*rt, yW+6); ctx.stroke(); }
  shell(); ctx.strokeStyle = "#334155"; ctx.lineWidth = 3; ctx.stroke();

  // labels
  arrow(ctx, 4, yF, 40, yF, "#57534e", 3, 8);
  text(ctx, P.coalLabel, 15, yF-19*kX, {size:14.5*kX, bold:true, color:"#57534e", align:"left"});
  arrow(ctx, W-4, yF, W-40, yF, "#1d4ed8", 3, 8);
  text(ctx, P.o2Label, W-19, yF-19*kX, {size:14.5*kX, bold:true, color:"#1d4ed8", align:"right"});
  text(ctx, P.syngasLabel, (xSc0+xSc1)/2, ySc0-14*kX, {size:12*kX, bold:true, color:"#b45309"});
  arrow(ctx, W-4, yOut, W-36, yOut, "#0284c7", 3, 8);
  text(ctx, P.steamLabel, W-19, yOut+18*kX, {size:12.5*kX, bold:true, color:"#0284c7", align:"right"});
  arrow(ctx, W-40, yP, W-6, yP, "#2563eb", 3.5, 9);
  text(ctx, P.prodLabel, W-19, yP-20*kX, {size:14.5*kX, bold:true, color:"#2563eb", align:"right"});
  const xShL = xSh-shW/2-10;
  text(ctx, P.shiftLabel, xShL, yShT+22*kX, {size:12.5*kX, bold:true, color:lab, align:"right"});
  text(ctx, P.shiftCat, xShL, yShT+40*kX, {size:11*kX, color:"#64748b", align:"right"});
  text(ctx, P.scrubLabel, (xSc0+xSc1)/2, ySc1+14*kX, {size:11.5*kX, color:lab});
  text(ctx, P.gasifLabel, xR, yTop+48, {size:13.5*kX, bold:true, color:lab, align:"left"});
  text(ctx, P.condLabel, xR, yTop+48+19*kX, {size:11.5*kX, color:"#64748b", align:"left"});
  const xLft = cx-ro-12;
  text(ctx, "flame zone", xLft, yTop+50, {size:11.5*kX, color:"#c2410c", align:"right"});
  text(ctx, "refractory lining", xLft, yCone-20, {size:11.5*kX, color:shade(P.brickColor,-30), align:"right"});
  text(ctx, "water quench", xLft, yW+22, {size:11.5*kX, color:"#0369a1", align:"right"});
  text(ctx, P.slagLabel, cx-12, H-24, {size:12.5*kX, bold:true, color:"#44403c", align:"right"});
  if (P.showEq){
    text(ctx, "C + ½ O₂ → CO   ΔH° = −111 kJ/mol", xe, yEq, {size:12*kX, color:lab, align:"left"});
    text(ctx, "C + H₂O → CO + H₂   ΔH° = +131 kJ/mol", xe, yEq+27*kX, {size:12*kX, color:lab, align:"left"});
    text(ctx, "CO + H₂O ⇌ CO₂ + H₂   ΔH° = −41 kJ/mol", xe, yEq+54*kX, {size:12*kX, color:lab, align:"left"});
  }
  ctx.restore();
}

function drawSurface(ctx,t,P,W,H){
  const s = W/800;
  const ar = 15*s, surfY = H*0.74;
  for (let row=0; row<2; row++){
    const y = surfY + ar + row*ar*1.65;
    ctx.fillStyle = row ? shade(P.surfaceColor,-25) : P.surfaceColor;
    for (let x = row?ar:0; x < W+ar; x += ar*1.9){
      ctx.beginPath(); ctx.arc(x,y,ar,0,7); ctx.fill();
    }
  }
  const nS = P.sites;
  for (let j=0;j<nS;j++){
    const x = W*(j+1)/(nS+1);
    const p = (t + j/nS) % 1;
    const topY = H*0.13, adsY = surfY-9*s, mr = 9*s;
    let y, col, sep = mr*0.95;
    if (p < 0.3){                       // approach
      y = lerp(topY, adsY, smooth(p/0.3)); col = P.reactantColor;
    } else if (p < 0.62){               // adsorbed: vibrate + react
      const u = (p-0.3)/0.32;
      y = adsY + Math.sin(u*10*Math.PI)*1.6*s;
      col = mixColor(P.reactantColor, P.productColor, smooth(u));
      sep = mr*(0.95 + 0.35*Math.sin(u*Math.PI));
    } else {                            // desorb
      y = lerp(adsY, topY, smooth((p-0.62)/0.38)); col = P.productColor;
    }
    let alpha = 1;
    if (p < 0.07) alpha = p/0.07; else if (p > 0.93) alpha = (1-p)/0.07;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x-sep, y, mr, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x+sep, y, mr, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }
  text(ctx, P.label, W/2, H*0.955, {size:14*s, color:"#334155"});
}

function drawDiffusion(ctx,t,P,W,H){
  const s = W/800, m = 26*s, r = P.radius*s, A = P.amplitude*s;
  const bx0=m, by0=m, bx1=W-m, by1=H-m;
  if (P.box){ ctx.strokeStyle="#94a3b8"; ctx.lineWidth=2*s; ctx.strokeRect(bx0,by0,bx1-bx0,by1-by0); }
  ctx.fillStyle = P.color;
  for (let i=0;i<P.count;i++){
    const q = i*13.7 + P.seed*101;
    const bx = lerp(bx0+r, bx1-r, rnd(q+1));
    const by = lerp(by0+r, by1-r, rnd(q+2));
    const f1 = 1+Math.floor(rnd(q+3)*3), f2 = 2+Math.floor(rnd(q+4)*4);
    const f3 = 1+Math.floor(rnd(q+5)*3), f4 = 2+Math.floor(rnd(q+6)*4);
    const dx = A*(0.7*Math.sin(2*Math.PI*(f1*t+rnd(q+7))) + 0.3*Math.sin(2*Math.PI*(f2*t+rnd(q+8))));
    const dy = A*(0.7*Math.sin(2*Math.PI*(f3*t+rnd(q+9))) + 0.3*Math.sin(2*Math.PI*(f4*t+rnd(q+10))));
    const x = clamp(bx+dx, bx0+r, bx1-r), y = clamp(by+dy, by0+r, by1-r);
    ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  }
}

function drawEnergy(ctx,t,P,W,H){
  const s = W/800;
  const x0 = W*0.13, x1 = W*0.90, y0 = H*0.80, scale = H*0.36;
  const E = u => P.deltaE*smooth((u-0.32)/0.36) + P.barrier*Math.exp(-((u-0.5)**2)/(2*0.115**2));
  const X = u => lerp(x0,x1,u), Y = u => y0 - E(u)*scale;
  // axes
  arrow(ctx, x0-26*s, y0+14*s, x0-26*s, H*0.14, "#475569", 2*s, 7*s);
  arrow(ctx, x0-26*s, y0+14*s, x1+22*s, y0+14*s, "#475569", 2*s, 7*s);
  ctx.save(); ctx.translate(x0-42*s, H*0.48); ctx.rotate(-Math.PI/2);
  text(ctx,"Energy",0,0,{size:14*s,color:"#475569"});
  ctx.restore();
  text(ctx,"Reaction coordinate",(x0+x1)/2, y0+32*s, {size:14*s,color:"#475569"});
  // dashed reference levels
  ctx.save(); ctx.setLineDash([6*s,5*s]); ctx.strokeStyle="#94a3b8"; ctx.lineWidth=1.5*s;
  ctx.beginPath();
  ctx.moveTo(X(0.12),Y(0));  ctx.lineTo(X(0.92),Y(0));
  ctx.moveTo(X(0.70),Y(1));  ctx.lineTo(X(1),Y(1));
  ctx.stroke(); ctx.restore();
  // curve
  ctx.strokeStyle = P.curveColor; ctx.lineWidth = 3*s; ctx.lineJoin = "round";
  ctx.beginPath();
  for (let i=0;i<=240;i++){ const u=i/240; if(i) ctx.lineTo(X(u),Y(u)); else ctx.moveTo(X(u),Y(u)); }
  ctx.stroke();
  // annotations
  text(ctx, P.reactLabel, X(0.05), Y(0)-16*s, {size:14*s, bold:true});
  text(ctx, P.prodLabel,  X(0.97), Y(1)-16*s, {size:14*s, bold:true, align:"right"});
  text(ctx, "TS", X(0.5), Y(0.5)-18*s, {size:13*s, color:"#475569"});
  if (P.showEa){
    vArrow2(ctx, X(0.5), Y(0)-2*s, Y(0.5)+4*s, "#475569", s);
    text(ctx,"Ea", X(0.5)+16*s, (Y(0)+Y(0.5))/2, {size:13*s, color:"#475569", align:"left"});
    vArrow2(ctx, X(0.84), Y(0)-2*s, Y(1)+(P.deltaE<0?-2:2)*s, "#475569", s);
    text(ctx,"ΔE", X(0.84)+14*s, (Y(0)+Y(1))/2, {size:13*s, color:"#475569", align:"left"});
  }
  // ball rolling over the barrier (fades at loop boundary)
  const u = smooth(clamp((t-0.12)/0.72, 0, 1));
  let alpha = 1;
  if (t < 0.06) alpha = t/0.06; else if (t > 0.94) alpha = (1-t)/0.06;
  const brr = 8*s;
  ctx.globalAlpha = alpha; ctx.fillStyle = P.ballColor;
  ctx.beginPath(); ctx.arc(X(u), Y(u)-brr-2*s, brr, 0, 7); ctx.fill();
  ctx.globalAlpha = 1;
}

function drawWave(ctx,t,P,W,H){
  const s = W/800, mid = H*0.56, A = P.amplitude*s;
  ctx.save(); ctx.setLineDash([6*s,6*s]); ctx.strokeStyle="#cbd5e1"; ctx.lineWidth=1.5*s;
  ctx.beginPath(); ctx.moveTo(0,mid); ctx.lineTo(W,mid); ctx.stroke(); ctx.restore();
  const yAt = x => mid + A*Math.sin(2*Math.PI*(P.wavelengths*x/W - P.cycles*t));
  ctx.strokeStyle = P.color; ctx.lineWidth = 3.5*s; ctx.lineJoin = "round";
  ctx.beginPath();
  for (let x=0;x<=W;x+=2){ if(x) ctx.lineTo(x,yAt(x)); else ctx.moveTo(x,yAt(x)); }
  ctx.stroke();
  if (P.showParticles){
    const n = P.wavelengths*8;
    ctx.fillStyle = P.particleColor;
    for (let i=0;i<=n;i++){ const x=i*W/n; ctx.beginPath(); ctx.arc(x,yAt(x),4.5*s,0,7); ctx.fill(); }
  }
  arrow(ctx, W*0.43, H*0.14, W*0.57, H*0.14, "#475569", 2.5*s, 8*s);
  text(ctx,"v", W*0.5, H*0.14-14*s, {size:15*s, bold:true, color:"#475569"});
}

function drawCycle(ctx,t,P,W,H){
  const s = Math.min(W,H)/500;
  const cx = W/2, cy = H*0.53, R = Math.min(W*0.30, H*0.32);
  const labels = [P.l1,P.l2,P.l3,P.l4];
  const angs = [-Math.PI/2, 0, Math.PI/2, Math.PI];
  // arc arrows (clockwise)
  ctx.lineCap = "round";
  const gap = 0.5;
  for (let i=0;i<4;i++){
    const a1 = angs[i]+gap, a2 = angs[i]+Math.PI/2-gap;
    ctx.strokeStyle = P.arrowColor; ctx.lineWidth = 3*s;
    ctx.beginPath(); ctx.arc(cx,cy,R,a1,a2); ctx.stroke();
    const hx = cx+R*Math.cos(a2), hy = cy+R*Math.sin(a2);
    const d = a2 + Math.PI/2;
    const tx = hx+11*s*Math.cos(d), ty = hy+11*s*Math.sin(d);
    const px = Math.cos(d+Math.PI/2), py = Math.sin(d+Math.PI/2);
    ctx.fillStyle = P.arrowColor;
    ctx.beginPath(); ctx.moveTo(tx,ty);
    ctx.lineTo(hx+px*6*s, hy+py*6*s); ctx.lineTo(hx-px*6*s, hy-py*6*s);
    ctx.closePath(); ctx.fill();
  }
  // moving marker (drawn under the node boxes)
  const a = -Math.PI/2 + 2*Math.PI*t;
  ctx.fillStyle = P.dotColor;
  ctx.beginPath(); ctx.arc(cx+R*Math.cos(a), cy+R*Math.sin(a), 7*s, 0, 7); ctx.fill();
  // nodes
  for (let i=0;i<4;i++){
    const nx = cx+R*Math.cos(angs[i]), ny = cy+R*Math.sin(angs[i]);
    ctx.font = `600 ${14*s}px "Segoe UI", Arial, sans-serif`;
    const bw = ctx.measureText(labels[i]).width + 24*s, bh = 30*s;
    ctx.fillStyle = "#ffffff"; ctx.strokeStyle = P.nodeColor; ctx.lineWidth = 2*s;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(nx-bw/2, ny-bh/2, bw, bh, 8*s);
    else ctx.rect(nx-bw/2, ny-bh/2, bw, bh);
    ctx.fill(); ctx.stroke();
    text(ctx, labels[i], nx, ny, {size:14*s, bold:true});
  }
  text(ctx, P.center, cx, cy, {size:15*s, bold:true, color:"#334155"});
}

/* Crumpled GO membrane, quasi-3D. The sheet is a height field over a diamond
   (a square flake seen in isometric view); rows are painted back-to-front so
   the ripples occlude each other the way a real crumpled sheet does. */
function drawCGO(ctx,t,P,W,H){
  const s   = Math.min(W/700, H/620);
  const TAU = Math.PI*2;
  const cx  = W*0.5, cy = H*0.43;
  const hx  = W*0.47, hy = H*0.125;     // half-diagonals of the sheet footprint
  const A   = P.crumple * s;            // crumple amplitude
  const F   = P.ripples;                // crumple density

  /* Height field: a dominant static crumple plus two quadrature fields, so the
     sheet breathes in place instead of a wave visibly travelling across it.
     cos/sin of 1*t only -> the loop closes seamlessly. */
  /* The crumple is frozen: only the gas moves. Six incommensurate directional
     waves give an irregular wrinkle rather than a plaid. No t here, which is
     also what lets the whole sheet be rendered once and cached below. */
  function hAt(a,b){
    return A*1.15*(0.44*Math.sin(TAU*F*(2.37*a + 1.61*b) + 0.3)
                 + 0.31*Math.sin(TAU*F*(1.19*a - 2.83*b) + 2.1)
                 + 0.24*Math.sin(TAU*F*(4.13*a + 3.07*b) + 4.2)
                 + 0.19*Math.sin(TAU*F*(5.71*a - 1.29*b) + 5.6)
                 + 0.13*Math.sin(TAU*F*(3.41*a + 6.89*b) + 1.4)
                 + 0.09*Math.sin(TAU*F*(8.53*a - 7.19*b) + 3.0));
  }
  // (u,v) are the on-screen diamond axes; the sheet is |u| + |v| <= 1
  function surf(u,v){
    const a = (u+v+1)/2, b = (v-u+1)/2, h = hAt(a,b);
    return {x: cx + u*hx, y: cy + v*hy - h, h};
  }
  const span   = x => clamp(1 - Math.abs(x-cx)/hx, 0, 1);
  const yTopAt = x => cy - hy*span(x) - A*1.7;
  const yBotAt = x => cy + hy*span(x) + A*1.7;
  const edge = (sign,n) => {            // -1 = back rim, +1 = front rim
    const pts = [];
    for (let i=0;i<=n;i++){ const u = -1 + 2*i/n; pts.push(surf(u, sign*(1-Math.abs(u)))); }
    return pts;
  };

  /* ---- molecule painters ------------------------------------------- */
  function ball(x,y,r,col){
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
    ctx.strokeStyle = shade(col,-70); ctx.lineWidth = Math.max(1, 1.1*s); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    ctx.beginPath(); ctx.arc(x-r*0.32, y-r*0.34, r*0.30, 0, 7); ctx.fill();
  }
